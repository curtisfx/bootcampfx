<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boot Camp FX — Chess</title>
<meta name="description" content="Boot Camp FX chess — park animals at first light. Tap to move. Play a friend or a shallow opponent.">
<meta name="theme-color" content="#0F1B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --predawn:#0F1B2C; --predawn-2:#16273D; --pine:#14291F;
    --dawn:#E8933A; --gold:#F2B84B; --day:#FBF7EE; --day-2:#F3ECDC;
    --ink:#14100A; --mist:#9FB0C4; --stone:#6A6255;
    --display:'Fraunces',serif; --body:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',monospace;
    --ease:cubic-bezier(.22,.7,.25,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--predawn);overflow:hidden;
    font-family:var(--body);color:var(--day);
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
  #board{display:block;width:100vw;height:100vh;}

  .hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;
    background:rgba(15,27,44,.42);border:1px solid rgba(138,151,166,.35);backdrop-filter:blur(10px);
    border-radius:14px;padding:9px 22px 10px;color:var(--day);text-shadow:0 2px 8px rgba(15,27,44,.5);}
  .hud .brand{font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,2.4vw,1.45rem);line-height:1.12;letter-spacing:.01em;}
  .hud .brand em{font-style:italic;color:var(--gold);}
  .hud .brand .sep{color:var(--mist);font-weight:400;padding:0 4px;}
  .hud .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mist);margin-top:3px;}
  .foot{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
    font-family:var(--mono);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(251,247,238,.62);
    text-shadow:0 1px 6px rgba(15,27,44,.6);white-space:nowrap;}
  .bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;
    pointer-events:auto;}
  .bar button,.bar .stat{
    font-family:var(--body);font-weight:700;font-size:.86rem;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;
    transition:transform .16s var(--ease), background .16s var(--ease);}
  .bar button{background:var(--dawn);color:#1B1206;}
  .bar button:hover{transform:translateY(-2px);background:var(--gold);}
  .bar button.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45);font-weight:600;}
  .bar .stat{background:rgba(15,27,44,.55);color:var(--day);border:1px solid rgba(138,151,166,.35);
    font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;min-width:140px;text-align:center;}

  @media (max-width:520px){
    .hud{padding:8px 14px 9px;border-radius:12px;}
    .hud .tag{letter-spacing:.18em;}
    .foot{font-size:.52rem;letter-spacing:.16em;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<canvas id="board"></canvas>

<div class="hud">
  <div class="brand">Boot Camp <em>FX</em><span class="sep">·</span>Chess</div>
  <div class="tag" id="hudTag">Ink to move</div>
</div>
<div class="foot">first light over the board · 86&nbsp;s dawn loop</div>
<div class="bar">
  <button type="button" id="btnNew">New game</button>
  <button type="button" class="ghost" id="btnMode">vs AI</button>
  <div class="stat" id="hudStat">your move</div>
</div>

<script>
(function(){
"use strict";

var cv = document.getElementById('board');
var ctx = cv.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W = 0, H = 0;
var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- palette ---------- */
var C = {
  predawn:'#0F1B2C', predawn2:'#16273D', pine:'#14291F',
  dawn:'#E8933A', gold:'#F2B84B', day:'#FBF7EE', day2:'#F3ECDC',
  ink:'#14100A', mist:'#9FB0C4', stone:'#6A6255',
  lineDay:'#E4DAC6', steel:'#8A97A6',
  skyHi:'#2C3A50'
};

/* ---------- time-driven sky (independent of any game action) ---------- */
var DAY_LOOP = 86;               /* full loop, wall-clock seconds */
var skyT = 0;                    /* accumulates real time */
function dayF(){ return 0.5 - 0.5 * Math.cos(skyT * 2 * Math.PI / DAY_LOOP); }

/* ---------- geometry ---------- */
var sq = 0, bx = 0, by = 0, board = 0;
function layout(){
  sq = Math.max(16, Math.floor(Math.min(W, H) * 0.58 / 8));
  board = sq * 8;
  bx = Math.round((W - board) / 2);
  by = Math.round((H - board) / 2);
}
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------- helpers ---------- */
function rnd(a, b){ return a + Math.random() * (b - a); }
function lerpColor(c1, c2, t){
  var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  var ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  var br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return 'rgb(' + Math.round(ar+(br-ar)*t) + ',' + Math.round(ag+(bg-ag)*t) + ',' + Math.round(ab+(bb-ab)*t) + ')';
}
function easeIO(u){ return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2) / 2; }
function anim(now, dur, keys){
  var t = (now % dur) / dur;
  for (var i = 0; i < keys.length - 1; i++){
    var a = keys[i], b = keys[i+1];
    if (t >= a[0] && t <= b[0]){
      var seg = (b[0] - a[0]) || 1;
      var u = easeIO((t - a[0]) / seg);
      return a[1] + (b[1] - a[1]) * u;
    }
  }
  return keys[keys.length-1][1];
}
function poly(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function capsule(x, y, w, h){
  var r = w / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x + r, y + r, r, -Math.PI/2, Math.PI/2, true);
  ctx.lineTo(x + r, y + h - r);
  ctx.arc(x + r, y + h - r, r, Math.PI/2, -Math.PI/2, true);
  ctx.closePath(); ctx.fill();
}

/* ---------- starting position ----------
   Rank 0 (bottom) = White back rank, rank 1 = White pawns,
   rank 6 = Black pawns, rank 7 = Black back rank.
   White team is drawn in ink, Black team in stone.
   All species are authored FACING LEFT; the black side is
   flipped with ctx.scale(-1,1) so it faces the opponent.      */
var BACK = ['rook','knight','bishop','queen','king','bishop','knight','rook'];
var pieces = [];
var nextId = 1;
function resetPieces(){
  pieces = [];
  nextId = 1;
  for (var f = 0; f < 8; f++){
    pieces.push({ id:nextId++, file:f, rank:1, type:'pawn',  side:'w', ph:(f*0.9 + 1.7) % 6.283, moved:false });
    pieces.push({ id:nextId++, file:f, rank:6, type:'pawn',  side:'b', ph:(f*1.3 + 0.4) % 6.283, moved:false });
    pieces.push({ id:nextId++, file:f, rank:0, type:BACK[f], side:'w', ph:(f*0.6 + 2.2) % 6.283, moved:false });
    pieces.push({ id:nextId++, file:f, rank:7, type:BACK[f], side:'b', ph:(f*1.1 + 4.1) % 6.283, moved:false });
  }
}
resetPieces();

function sideColor(side){ return side === 'w' ? C.ink : C.stone; }
function eyeColor(side){ return side === 'w' ? C.day2 : C.ink; }

/* Height/mass descends stag → owl → fox/beaver → rabbit → squirrel,
   so a rank reads from the outline even at ~40px squares. */
function scaleFor(type, sq){
  switch(type){
    case 'king':   return sq * 0.92 / 76;
    case 'queen':  return sq * 0.80 / 76;
    case 'rook':   return sq * 0.58 / 42;
    case 'bishop': return sq * 0.60 / 42;
    case 'knight': return sq * 0.50 / 46;
    case 'pawn':   return sq * 0.40 / 27;
  }
  return sq * 0.5 / 40;
}
var SHADOW_W = { king:0.52, queen:0.56, rook:0.62, bishop:0.52, knight:0.46, pawn:0.40 };

function drawShadow(p, cx, baseY){
  var w = SHADOW_W[p.type] * sq;
  ctx.fillStyle = 'rgba(20,16,10,0.28)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY + sq * 0.02, w / 2, Math.max(2, w * 0.10), 0, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------- King = Stag (antler crown, tallest, slow sway ±1.2°) ---------- */
function drawStag(ctx, t, side){
  var main = sideColor(side), eye = eyeColor(side);
  var sway = Math.sin(t * 0.7) * 1.2;
  ctx.save();
  ctx.translate(0, -30); ctx.rotate(sway * Math.PI / 180); ctx.translate(0, 30);
  // legs
  ctx.fillStyle = main;
  capsule(-7, -20, 2.6, 20);
  capsule(-2, -20, 2.6, 20);
  capsule(7, -20, 2.6, 20);
  capsule(12, -20, 2.6, 20);
  // body (slight slope toward the rear)
  ctx.beginPath(); ctx.ellipse(1, -34, 16, 11.5, -0.09, 0, Math.PI * 2); ctx.fill();
  // neck + head
  poly([[-9,-42],[-15,-50],[-7,-52],[-1,-43]]);
  ctx.beginPath(); ctx.ellipse(-15, -55, 6.5, 5.5, -0.12, 0, Math.PI * 2); ctx.fill();
  // muzzle + ear
  ctx.beginPath(); ctx.ellipse(-22, -53.5, 3.4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  poly([[-12,-59],[-10,-64],[-8,-58]]);
  // tail tuft
  poly([[17,-36],[21,-39],[19,-34]]);
  // antler crown
  ctx.strokeStyle = main; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, -59);
  ctx.quadraticCurveTo(-19, -64, -23, -68);
  ctx.moveTo(-18, -62.5); ctx.quadraticCurveTo(-22, -63.5, -25, -65);
  ctx.moveTo(-23, -68); ctx.quadraticCurveTo(-26, -70, -28, -73);
  ctx.moveTo(-14, -59);
  ctx.quadraticCurveTo(-10, -66, -12, -71);
  ctx.moveTo(-11, -64); ctx.quadraticCurveTo(-7, -66, -5, -68);
  ctx.stroke();
  // eye
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-17, -55, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- Queen = Owl (shipped homepage/basketball owl; mist body;
   blink 4.2s [[0,1],[.96,1],[.98,.1],[1,1]], sway 5.4s
   [[0,0],[.28,6],[.62,-4],[1,0]]). Front-facing, so the black-side
   mirror is a no-op — faithful to the shipped art. ---------- */
function drawOwl(ctx, t, side){
  var main = sideColor(side);
  var sway = anim(t, 5.4, [[0,0],[0.28,6],[0.62,-4],[1,0]]);
  var blink = anim(t, 4.2, [[0,1],[0.96,1],[0.98,0.1],[1,1]]);
  ctx.save();
  // pivot (0,29) ≈ CSS 50% 62% of the 64×84 box (feet at y 76 → 76-47=29)
  ctx.translate(0, 29); ctx.rotate(sway * Math.PI / 180); ctx.translate(0, -29);
  // body
  ctx.fillStyle = C.mist;
  ctx.beginPath(); ctx.ellipse(0, 26, 18, 24, 0, 0, Math.PI * 2); ctx.fill();
  // ear tufts
  poly([[-13,62],[-18,76],[-10,64]]);
  poly([[13,62],[18,76],[10,64]]);
  // head
  ctx.beginPath(); ctx.arc(0, 50, 17, 0, Math.PI * 2); ctx.fill();
  // wings (idle rock, per basketball)
  var flap = Math.sin(t * 1.3) * 2.4;
  ctx.fillStyle = '#7A8A9A';
  ctx.save(); ctx.translate(-16, 40); ctx.rotate(-flap * Math.PI / 180); ctx.translate(16, -40);
  ctx.beginPath(); ctx.moveTo(-16, 40); ctx.bezierCurveTo(-20, 30, -20, 18, -14, 14); ctx.lineTo(-14, 36); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(16, 40); ctx.rotate(flap * Math.PI / 180); ctx.translate(-16, -40);
  ctx.beginPath(); ctx.moveTo(16, 40); ctx.bezierCurveTo(20, 30, 20, 18, 14, 14); ctx.lineTo(14, 36); ctx.closePath(); ctx.fill();
  ctx.restore();
  // eyes — blink pivot 50% 50% of the eyes group
  ctx.save();
  ctx.translate(0, 52); ctx.scale(1, blink); ctx.translate(0, -52);
  ctx.fillStyle = C.day2;
  ctx.beginPath(); ctx.arc(-7, 52, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, 52, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(-7, 52, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, 52, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // beak (side color — dawn/gold are state colors, never piece fills)
  ctx.fillStyle = main;
  poly([[0,47],[-4,40],[0,42],[4,40]]);
  // feet
  ctx.strokeStyle = main; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8,6); ctx.lineTo(-8,0);
  ctx.moveTo(-10,6); ctx.lineTo(-10,0);
  ctx.moveTo(-6,6); ctx.lineTo(-6,0);
  ctx.moveTo(8,6); ctx.lineTo(8,0);
  ctx.moveTo(6,6); ctx.lineTo(6,0);
  ctx.moveTo(10,6); ctx.lineTo(10,0);
  ctx.stroke();
  ctx.restore();
}

/* ---------- Rook = Beaver (broad mass, flat tail, sway 6–7s) ---------- */
function drawBeaver(ctx, t, side){
  var main = sideColor(side), eye = eyeColor(side);
  var sway = Math.sin(t * 2 * Math.PI / 6.5) * 3;
  ctx.save();
  ctx.translate(0, -18); ctx.rotate(sway * Math.PI / 180); ctx.translate(0, 18);
  // flat tail (behind)
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(16, -9, 13, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(243,236,220,0.55)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(8, -10.5); ctx.lineTo(14, -9.5);
  ctx.moveTo(12, -8); ctx.lineTo(18, -7);
  ctx.moveTo(18, -11.5); ctx.lineTo(23, -10);
  ctx.stroke();
  // body mass
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(-2, -24, 17, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(243,236,220,0.30)';
  ctx.beginPath(); ctx.ellipse(-4, -21, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.arc(-15, -32, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-24, -30, 4.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  // nose + teeth
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-28, -30, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.day2;
  ctx.fillRect(-26.5, -26.5, 1.7, 3.2);
  ctx.fillRect(-24.3, -26.5, 1.7, 3.2);
  // ear + eye
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.arc(-15, -39, 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-18, -33, 1.3, 0, Math.PI * 2); ctx.fill();
  // stubby legs
  ctx.fillStyle = main;
  capsule(-12, -8, 3, 8);
  capsule(-2, -8, 3, 8);
  capsule(8, -8, 3.4, 8);
  ctx.restore();
}

/* ---------- Bishop = Fox (low, long tail curve) ---------- */
function drawFox(ctx, t, side){
  var main = sideColor(side), eye = eyeColor(side);
  var tw = Math.sin(t * 1.6) * 4;
  // long tail curve (behind, waves slowly)
  ctx.fillStyle = main;
  ctx.save();
  ctx.translate(10, -16); ctx.rotate(tw * Math.PI / 180); ctx.translate(-10, 16);
  ctx.beginPath();
  ctx.moveTo(8, -18);
  ctx.quadraticCurveTo(24, -32, 33, -12);
  ctx.quadraticCurveTo(29, -4, 18, -8);
  ctx.quadraticCurveTo(12, -8, 8, -18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.day2;
  ctx.beginPath(); ctx.ellipse(30, -14, 3.2, 2.6, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // legs
  ctx.fillStyle = main;
  capsule(-10, -10, 2.2, 10);
  capsule(-2, -10, 2.2, 10);
  capsule(6, -10, 2.2, 10);
  capsule(12, -10, 2.2, 10);
  // low body
  ctx.beginPath(); ctx.ellipse(-4, -24, 14, 8.5, -0.04, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(243,236,220,0.45)';
  ctx.beginPath(); ctx.ellipse(-11, -25, 5.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  // head wedge (pointed snout left) + ears
  ctx.fillStyle = main;
  poly([[-28,-24],[-16,-31],[-10,-22]]);
  poly([[-13,-34],[-9,-30],[-7,-37]]);
  poly([[-18,-32],[-14,-29],[-13,-36]]);
  // eye
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-18, -26, 1.15, 0, Math.PI * 2); ctx.fill();
}

/* ---------- Knight = Rabbit (shipped homepage rabbit; earTwitch +
   wrHop 0→-12→0, staggered per piece) ---------- */
function drawRabbit(ctx, t, side){
  var main = sideColor(side), eye = eyeColor(side);
  var hop = anim(t, 2.5, [[0,0],[0.45,-12],[0.55,0],[1,0]]);
  var twitch = anim(t, 2.6, [[0,0],[0.88,0],[0.92,-9],[0.96,5],[1,0]]);
  ctx.save();
  ctx.translate(0, hop);
  // body
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(-8, 24); ctx.bezierCurveTo(-14, 22, -18, 16, -17, 10);
  ctx.bezierCurveTo(-16, 3, -8, 0, 2, 0);
  ctx.bezierCurveTo(12, 0, 18, -4, 18, -11);
  ctx.bezierCurveTo(18, -18, 12, -24, 4, -25);
  ctx.closePath(); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(-10, 24, 6, 0, Math.PI * 2); ctx.fill();
  // ears — twitch pivot 50% 16% of the 52×48 box (→ local 0,38.3)
  ctx.save();
  ctx.translate(0, 38.3); ctx.rotate(twitch * Math.PI / 180); ctx.translate(0, -38.3);
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(-6, 32); ctx.bezierCurveTo(-9, 40, -9, 45, -6, 46);
  ctx.bezierCurveTo(-3, 45, -3, 38, -3, 32);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(0, 32); ctx.bezierCurveTo(-1, 41, 0, 45, 3, 45);
  ctx.bezierCurveTo(5, 43, 4, 37, 3, 32);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // eye (faces left)
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-12, 25.5, 1.3, 0, Math.PI * 2); ctx.fill();
  // tail
  ctx.fillStyle = C.day2;
  ctx.beginPath(); ctx.arc(19, 6, 4, 0, Math.PI * 2); ctx.fill();
  // feet
  ctx.strokeStyle = main; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(-18, 0);
  ctx.moveTo(8, 0); ctx.lineTo(14, 0);
  ctx.stroke();
  ctx.restore();
}

/* ---------- Pawn = Squirrel (small, big tail arc, micro-darts) ---------- */
function drawSquirrel(ctx, t, side){
  var main = sideColor(side), eye = eyeColor(side);
  var dartY = Math.sin(t * 9) * 1.3;
  var dartX = Math.sin(t * 5.3) * 0.9;
  var flick = Math.sin(t * 2.2) * 5;
  ctx.save();
  ctx.translate(dartX, dartY);
  // big tail arc (behind)
  ctx.save();
  ctx.translate(10, -14); ctx.rotate(flick * Math.PI / 180); ctx.translate(-10, 14);
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.arc(13, -13, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.day2;
  ctx.beginPath(); ctx.arc(16.5, -8.5, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // feet
  ctx.strokeStyle = main; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, 0); ctx.lineTo(-15, 0);
  ctx.moveTo(6, 0); ctx.lineTo(9, 0);
  ctx.stroke();
  // body + head
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.ellipse(-2, -15, 10, 7.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-10, -21, 6, 0, Math.PI * 2); ctx.fill();
  poly([[-14,-25],[-15,-30],[-11,-26]]);
  // eye
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(-12, -22, 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

var DRAW = {
  king: drawStag, queen: drawOwl, rook: drawBeaver,
  bishop: drawFox, knight: drawRabbit, pawn: drawSquirrel
};

function drawPiece(p, cx, baseY, t){
  var k = scaleFor(p.type, sq);
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(k, k);
  if (p.side === 'b') ctx.scale(-1, 1);   /* black faces the opponent */
  DRAW[p.type](ctx, t + p.ph, p.side);
  ctx.restore();
}

/* ---------- scene ---------- */
var clouds = [], stars = [];
function initScene(){
  clouds = []; stars = [];
  for (var i = 0; i < 5; i++) clouds.push({ x: rnd(0, W), y: rnd(H*0.05, H*0.30), s: rnd(0.5, 1.1), a: rnd(0.18, 0.4), v: rnd(6, 16) });
  for (var j = 0; j < 46; j++) stars.push({ x: rnd(0, W), y: rnd(0, H*0.35), a: rnd(0.2, 0.6), p: rnd(0, 6.3) });
}
function drawCloud(c){
  ctx.globalAlpha = c.a; ctx.fillStyle = C.mist;
  ctx.beginPath(); ctx.arc(c.x, c.y, 18*c.s, 0, Math.PI*2);
  ctx.arc(c.x+22*c.s, c.y+4, 14*c.s, 0, Math.PI*2);
  ctx.arc(c.x-18*c.s, c.y+6, 12*c.s, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}


/* ---------- game state ---------- */
var VAL = { pawn:100, knight:320, bishop:330, rook:500, queen:900, king:20000 };
var turn = 'w';
var selected = null;
var legal = [];
var ep = null;
var castle = { wK:true, wQ:true, bK:true, bQ:true };
var vsAI = true;
var STATE = 'play';
var departing = [];
var flashes = [];
var aiWait = 0;
var hudTag = document.getElementById('hudTag');
var hudStat = document.getElementById('hudStat');
var btnMode = document.getElementById('btnMode');

function copyList(list){
  var o = [];
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    o.push({ id:p.id, file:p.file, rank:p.rank, type:p.type, side:p.side, ph:p.ph, moved:p.moved });
  }
  return o;
}
function occ(f, r, list){
  for (var i = 0; i < list.length; i++) if (list[i].file === f && list[i].rank === r) return list[i];
  return null;
}
function onBoard(f, r){ return f >= 0 && f < 8 && r >= 0 && r < 8; }
function enemy(side){ return side === 'w' ? 'b' : 'w'; }
function mv(p, f, r, extra){
  var m = { pid:p.id, f:f, r:r, capture:null, castle:null, ep:false, promote:false };
  if (extra) for (var k in extra) m[k] = extra[k];
  return m;
}

function genPseudo(side, list, asAttack){
  var out = [];
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    if (p.side !== side) continue;
    if (p.type === 'pawn'){
      var dir = p.side === 'w' ? 1 : -1;
      var start = p.side === 'w' ? 1 : 6;
      var df;
      if (asAttack){
        for (df = -1; df <= 1; df += 2){
          if (onBoard(p.file + df, p.rank + dir)) out.push(mv(p, p.file + df, p.rank + dir));
        }
      } else {
        var f1 = p.file, r1 = p.rank + dir;
        if (onBoard(f1, r1) && !occ(f1, r1, list)){
          out.push(mv(p, f1, r1, { promote: r1 === 0 || r1 === 7 }));
          var r2 = p.rank + dir * 2;
          if (p.rank === start && !occ(f1, r2, list)) out.push(mv(p, f1, r2));
        }
        for (df = -1; df <= 1; df += 2){
          var cf = p.file + df, cr = p.rank + dir;
          if (!onBoard(cf, cr)) continue;
          var o = occ(cf, cr, list);
          if (o && o.side !== p.side) out.push(mv(p, cf, cr, { capture:o.id, promote: cr === 0 || cr === 7 }));
          if (ep && ep.f === cf && ep.r === cr){
            var vic = occ(cf, p.rank, list);
            if (vic && vic.side !== p.side && vic.type === 'pawn')
              out.push(mv(p, cf, cr, { capture:vic.id, ep:true }));
          }
        }
      }
    } else if (p.type === 'knight'){
      var N = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
      for (var n = 0; n < 8; n++){
        var nf = p.file + N[n][0], nr = p.rank + N[n][1];
        if (!onBoard(nf, nr)) continue;
        var no = occ(nf, nr, list);
        if (!no || no.side !== p.side) out.push(mv(p, nf, nr, no ? { capture:no.id } : null));
      }
    } else if (p.type === 'bishop' || p.type === 'rook' || p.type === 'queen'){
      var D = [];
      if (p.type !== 'rook') D.push([1,1],[1,-1],[-1,-1],[-1,1]);
      if (p.type !== 'bishop') D.push([1,0],[-1,0],[0,1],[0,-1]);
      for (var d = 0; d < D.length; d++){
        var f = p.file, r = p.rank;
        for (;;){
          f += D[d][0]; r += D[d][1];
          if (!onBoard(f, r)) break;
          var so = occ(f, r, list);
          if (!so) out.push(mv(p, f, r));
          else { if (so.side !== p.side) out.push(mv(p, f, r, { capture:so.id })); break; }
        }
      }
    } else if (p.type === 'king'){
      for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++){
        if (!dx && !dy) continue;
        var kf = p.file + dx, kr = p.rank + dy;
        if (!onBoard(kf, kr)) continue;
        var ko = occ(kf, kr, list);
        if (!ko || ko.side !== p.side) out.push(mv(p, kf, kr, ko ? { capture:ko.id } : null));
      }
    }
  }
  return out;
}

function applyMove(list, m, liveEp, liveCastle){
  var nxt = copyList(list);
  var p = null, i;
  for (i = 0; i < nxt.length; i++) if (nxt[i].id === m.pid) p = nxt[i];
  if (!p) return { list:nxt, ep:null, castle:liveCastle };
  if (m.capture){
    var keep = [];
    for (i = 0; i < nxt.length; i++) if (nxt[i].id !== m.capture) keep.push(nxt[i]);
    nxt = keep;
    for (i = 0; i < nxt.length; i++) if (nxt[i].id === m.pid) p = nxt[i];
  }
  var fromF = p.file, fromR = p.rank;
  p.file = m.f; p.rank = m.r; p.moved = true;
  if (m.promote) p.type = 'queen';
  if (m.castle === 'K'){
    for (i = 0; i < nxt.length; i++) if (nxt[i].side === p.side && nxt[i].type === 'rook' && nxt[i].file === 7){ nxt[i].file = 5; nxt[i].moved = true; }
  }
  if (m.castle === 'Q'){
    for (i = 0; i < nxt.length; i++) if (nxt[i].side === p.side && nxt[i].type === 'rook' && nxt[i].file === 0){ nxt[i].file = 3; nxt[i].moved = true; }
  }
  var newEp = null;
  if (p.type === 'pawn' && Math.abs(m.r - fromR) === 2) newEp = { f:fromF, r:(fromR + m.r) / 2 };
  var cst = { wK:liveCastle.wK, wQ:liveCastle.wQ, bK:liveCastle.bK, bQ:liveCastle.bQ };
  if (p.type === 'king'){
    if (p.side === 'w'){ cst.wK = false; cst.wQ = false; }
    else { cst.bK = false; cst.bQ = false; }
  }
  if (p.type === 'rook'){
    if (p.side === 'w' && fromF === 7 && fromR === 0) cst.wK = false;
    if (p.side === 'w' && fromF === 0 && fromR === 0) cst.wQ = false;
    if (p.side === 'b' && fromF === 7 && fromR === 7) cst.bK = false;
    if (p.side === 'b' && fromF === 0 && fromR === 7) cst.bQ = false;
  }
  if (m.capture){
    /* captured rook on its home square kills that castle right */
    if (m.f === 7 && m.r === 0) cst.wK = false;
    if (m.f === 0 && m.r === 0) cst.wQ = false;
    if (m.f === 7 && m.r === 7) cst.bK = false;
    if (m.f === 0 && m.r === 7) cst.bQ = false;
  }
  return { list:nxt, ep:newEp, castle:cst };
}

function kingOf(side, list){
  for (var i = 0; i < list.length; i++) if (list[i].type === 'king' && list[i].side === side) return list[i];
  return null;
}
function inCheck(side, list){
  var k = kingOf(side, list);
  if (!k) return true;
  var atk = genPseudo(enemy(side), list, true);
  for (var i = 0; i < atk.length; i++) if (atk[i].f === k.file && atk[i].r === k.rank) return true;
  return false;
}

function addCastles(side, list, out){
  var k = kingOf(side, list);
  if (!k || k.moved) return;
  var rank = side === 'w' ? 0 : 7;
  if (k.file !== 4 || k.rank !== rank) return;
  if (inCheck(side, list)) return;
  var rightsK = side === 'w' ? castle.wK : castle.bK;
  var rightsQ = side === 'w' ? castle.wQ : castle.bQ;
  var them = enemy(side);
  if (rightsK && !occ(5, rank, list) && !occ(6, rank, list)){
    var rookH = occ(7, rank, list);
    if (rookH && rookH.type === 'rook' && rookH.side === side && !rookH.moved){
      var ok = true;
      var atk = genPseudo(them, list, true);
      for (var i = 0; i < atk.length; i++) if ((atk[i].f === 5 || atk[i].f === 6) && atk[i].r === rank) ok = false;
      if (ok) out.push(mv(k, 6, rank, { castle:'K' }));
    }
  }
  if (rightsQ && !occ(3, rank, list) && !occ(2, rank, list) && !occ(1, rank, list)){
    var rookA = occ(0, rank, list);
    if (rookA && rookA.type === 'rook' && rookA.side === side && !rookA.moved){
      var ok2 = true;
      var atk2 = genPseudo(them, list, true);
      for (var j = 0; j < atk2.length; j++) if ((atk2[j].f === 3 || atk2[j].f === 2) && atk2[j].r === rank) ok2 = false;
      if (ok2) out.push(mv(k, 2, rank, { castle:'Q' }));
    }
  }
}

function legalMoves(side, list, liveEp, liveCastle){
  list = list || pieces;
  liveEp = liveEp === undefined ? ep : liveEp;
  liveCastle = liveCastle || castle;
  var savedEp = ep, savedC = castle;
  ep = liveEp; castle = liveCastle;
  var raw = genPseudo(side, list, false);
  addCastles(side, list, raw);
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var sim = applyMove(list, raw[i], liveEp, liveCastle);
    if (!inCheck(side, sim.list)) out.push(raw[i]);
  }
  ep = savedEp; castle = savedC;
  return out;
}

function findPiece(id){
  for (var i = 0; i < pieces.length; i++) if (pieces[i].id === id) return pieces[i];
  return null;
}

function hopOff(p){
  var cx = bx + (p.file + 0.5) * sq;
  var cy = by + (p.rank + 0.5) * sq + sq * 0.5 - 1;
  var toward = p.file < 4 ? -1 : 1;
  departing.push({
    type:p.type, side:p.side, ph:p.ph,
    x:cx, y:cy, vx: toward * (180 + rnd(40, 90)), vy: -220,
    a:1, life: RM ? 0.01 : 0.7
  });
}

function doMove(m){
  if (STATE !== 'play') return;
  var p = findPiece(m.pid);
  if (!p) return;
  var cap = null;
  if (m.capture) cap = findPiece(m.capture);
  if (cap) hopOff(cap);
  flashes.push({ f:m.f, r:m.r, t:0.35 });
  var sim = applyMove(pieces, m, ep, castle);
  pieces = sim.list;
  ep = sim.ep;
  castle = sim.castle;
  selected = null;
  legal = [];
  turn = enemy(turn);
  var moves = legalMoves(turn);
  if (!moves.length){
    STATE = 'over';
    if (inCheck(turn, pieces)) setStatus((turn === 'w' ? 'Ink' : 'Stone') + ' is mated');
    else setStatus('stalemate');
  } else {
    if (inCheck(turn, pieces)) setStatus((turn === 'w' ? 'Ink' : 'Stone') + ' in check');
    else setStatus((turn === 'w' ? 'Ink' : 'Stone') + ' to move');
    if (vsAI && turn === 'b' && STATE === 'play') aiWait = RM ? 0.05 : 0.38;
  }
}

function setStatus(s){
  if (hudTag) hudTag.textContent = s;
  if (hudStat) hudStat.textContent = STATE === 'over' ? s : (vsAI ? (turn === 'w' ? 'your move' : 'thinking') : s);
}

function scoreMove(m){
  var s = 0;
  if (m.capture){
    var c = findPiece(m.capture);
    if (c) s += VAL[c.type] || 0;
  }
  if (m.promote) s += 800;
  s += (4 - Math.abs(m.f - 3.5)) * 4 + (4 - Math.abs(m.r - 3.5)) * 2;
  var sim = applyMove(pieces, m, ep, castle);
  if (inCheck(enemy(turn), sim.list)) s += 40;
  var replies = legalMoves(enemy(turn), sim.list, sim.ep, sim.castle);
  var hang = 0;
  for (var i = 0; i < replies.length; i++){
    if (replies[i].capture === m.pid){
      var me = findPiece(m.pid);
      hang = Math.max(hang, VAL[me.type] || 0);
    }
  }
  s -= hang * 0.9;
  return s;
}

function aiPick(){
  var moves = legalMoves('b');
  if (!moves.length) return null;
  var best = -1e9, pool = [];
  for (var i = 0; i < moves.length; i++){
    var sc = scoreMove(moves[i]);
    if (sc > best + 8){ best = sc; pool = [moves[i]]; }
    else if (Math.abs(sc - best) <= 8) pool.push(moves[i]);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function sqFromEvent(e){
  var rect = cv.getBoundingClientRect();
  var x = (e.clientX - rect.left);
  var y = (e.clientY - rect.top);
  var f = Math.floor((x - bx) / sq);
  var r = Math.floor((y - by) / sq);
  if (!onBoard(f, r)) return null;
  return { f:f, r:r };
}

function onPointer(e){
  if (e.target && e.target.closest && e.target.closest('.bar')) return;
  if (STATE !== 'play') return;
  if (vsAI && turn === 'b') return;
  var sqp = sqFromEvent(e);
  if (!sqp){ selected = null; legal = []; return; }
  if (selected){
    for (var i = 0; i < legal.length; i++){
      if (legal[i].f === sqp.f && legal[i].r === sqp.r){ doMove(legal[i]); return; }
    }
  }
  var p = occ(sqp.f, sqp.r, pieces);
  if (p && p.side === turn){
    selected = p;
    var all = legalMoves(turn);
    legal = [];
    for (var j = 0; j < all.length; j++) if (all[j].pid === p.id) legal.push(all[j]);
  } else {
    selected = null; legal = [];
  }
}

function newGame(){
  resetPieces();
  turn = 'w';
  selected = null;
  legal = [];
  ep = null;
  castle = { wK:true, wQ:true, bK:true, bQ:true };
  STATE = 'play';
  departing = [];
  flashes = [];
  aiWait = 0;
  setStatus('Ink to move');
}

document.getElementById('btnNew').addEventListener('click', function(e){ e.stopPropagation(); newGame(); });
btnMode.addEventListener('click', function(e){
  e.stopPropagation();
  vsAI = !vsAI;
  btnMode.textContent = vsAI ? 'vs AI' : '2 player';
  newGame();
});
cv.addEventListener('pointerdown', onPointer);

function update(dt){
  if (!RM){
    skyT += dt;
    for (var i = 0; i < clouds.length; i++){
      var c = clouds[i];
      c.x -= c.v * dt;
      if (c.x < -160){ c.x = W + rnd(0, 120); c.y = rnd(H*0.05, H*0.30); }
    }
  }
  for (var d = departing.length - 1; d >= 0; d--){
    var g = departing[d];
    g.life -= dt;
    g.x += g.vx * dt;
    g.vy += 780 * dt;
    g.y += g.vy * dt;
    g.a = Math.max(0, g.life / 0.7);
    if (g.life <= 0) departing.splice(d, 1);
  }
  for (var f = flashes.length - 1; f >= 0; f--){
    flashes[f].t -= dt;
    if (flashes[f].t <= 0) flashes.splice(f, 1);
  }
  if (aiWait > 0){
    aiWait -= dt;
    if (aiWait <= 0 && STATE === 'play' && vsAI && turn === 'b'){
      var pick = aiPick();
      if (pick) doMove(pick);
    }
  }
}

function drawSky(){
  var f = RM ? 0.55 : dayF();
  /* 5-stop lerp matching basketball: NIGHT predawn… → DAY skyHi/#6E5A54/dawn/gold/day */
  var g = ctx.createLinearGradient(0, 0, 0, H);
  var stops = [[0, C.predawn, C.skyHi], [0.30, C.predawn, '#6E5A54'], [0.68, C.predawn2, C.dawn], [0.88, C.skyHi, C.gold], [1, C.skyHi, C.day]];
  for (var si = 0; si < stops.length; si++){
    g.addColorStop(stops[si][0], lerpColor(stops[si][1], stops[si][2], f));
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* stars — fade with daylight, twinkle unless reduced motion */
  var now = performance.now() / 1000;
  ctx.fillStyle = C.gold;
  for (var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = RM ? 0.5 : (0.45 + 0.55 * Math.abs(Math.sin(now / 900 + st.p)));
    ctx.globalAlpha = st.a * tw * (1 - f * 0.75);
    ctx.beginPath(); ctx.arc(st.x, st.y, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* sun — rises from below the frame, exits the frame at peak (f = 1) */
  var sunY = H + 60 - f * (H + 180);
  var sg = ctx.createRadialGradient(W*0.5, sunY, 8, W*0.5, sunY, 90);
  sg.addColorStop(0, 'rgba(242,184,75,0.85)');
  sg.addColorStop(1, 'rgba(232,147,58,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(W*0.5, sunY, 90, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.gold;
  ctx.beginPath(); ctx.arc(W*0.5, sunY, 22 + f * 10, 0, Math.PI * 2); ctx.fill();

  /* drifting clouds */
  for (var ci = 0; ci < clouds.length; ci++) drawCloud(clouds[ci]);

  /* pine strip + first-light horizon line */
  var strip = Math.max(10, Math.round(H * 0.045));
  ctx.fillStyle = C.pine;
  ctx.fillRect(0, H - strip, W, strip);
  ctx.fillStyle = 'rgba(232,147,58,' + (0.2 + 0.35 * f).toFixed(3) + ')';
  ctx.fillRect(0, H - strip, W, 2.5);
}

function drawBoard(){
  /* outer frame */
  ctx.fillStyle = C.day;
  ctx.fillRect(bx - 4, by - 4, board + 8, board + 8);
  /* light squares */
  ctx.fillRect(bx, by, board, board);
  /* dark squares = C.day2 */
  ctx.fillStyle = C.day2;
  for (var r = 0; r < 8; r++){
    for (var f = 0; f < 8; f++){
      if ((f + r) % 2 === 1) ctx.fillRect(bx + f*sq, by + r*sq, sq, sq);
    }
  }
  /* grid + border in lineDay / steel */
  ctx.strokeStyle = C.lineDay; ctx.lineWidth = 1;
  ctx.beginPath();
  for (var i = 1; i < 8; i++){
    ctx.moveTo(bx + i*sq, by); ctx.lineTo(bx + i*sq, by + board);
    ctx.moveTo(bx, by + i*sq); ctx.lineTo(bx + board, by + i*sq);
  }
  ctx.stroke();
  ctx.strokeStyle = C.steel; ctx.lineWidth = 2;
  ctx.strokeRect(bx - 4.5, by - 4.5, board + 9, board + 9);
}

function drawPieces(){
  var t = RM ? 0 : performance.now() / 1000;
  for (var i = 0; i < pieces.length; i++){
    var p = pieces[i];
    var cx = bx + (p.file + 0.5) * sq;
    var baseY = by + (p.rank + 0.5) * sq + sq * 0.5 - 1;
    drawShadow(p, cx, baseY);
    drawPiece(p, cx, baseY, t);
  }
}

function drawMarks(){
  if (selected){
    ctx.fillStyle = 'rgba(232,147,58,0.38)';
    ctx.fillRect(bx + selected.file * sq, by + selected.rank * sq, sq, sq);
  }
  for (var i = 0; i < flashes.length; i++){
    var fl = flashes[i];
    ctx.fillStyle = 'rgba(232,147,58,' + (0.55 * (fl.t / 0.35)).toFixed(3) + ')';
    ctx.fillRect(bx + fl.f * sq, by + fl.r * sq, sq, sq);
  }
  for (var j = 0; j < legal.length; j++){
    var m = legal[j];
    var cx = bx + (m.f + 0.5) * sq;
    var cy = by + (m.r + 0.5) * sq;
    if (m.capture || m.ep){
      ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, sq * 0.38, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(4, sq * 0.12), 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawDeparting(){
  var t = RM ? 0 : performance.now() / 1000;
  for (var i = 0; i < departing.length; i++){
    var g = departing[i];
    ctx.save();
    ctx.globalAlpha = g.a;
    drawPiece(g, g.x, g.y, t);
    ctx.restore();
  }
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawBoard();
  drawMarks();
  drawPieces();
  drawDeparting();
}

var last = performance.now();
function frame(now){
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
initScene();
setStatus('Ink to move');
requestAnimationFrame(frame);
})();
</script>
</body>
