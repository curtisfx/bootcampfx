<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boot Camp FX — Chess</title>
<meta name="description" content="Boot Camp FX chess — turtle, bumblebee, coyote, rabbit, squirrel, owl. Tap to move.">
<meta name="theme-color" content="#0F1B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --predawn:#0F1B2C; --predawn-2:#16273D; --pine:#14291F;
    --dawn:#E8933A; --gold:#F2B84B; --day:#FBF7EE; --day-2:#F3ECDC;
    --ink:#14100A; --mist:#9FB0C4; --stone:#6A6255;
    --display:'Fraunces',serif; --body:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',monospace;
    --ease:cubic-bezier(.22,.7,.25,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--predawn);overflow:hidden;
    font-family:var(--body);color:var(--day);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #board{display:block;width:100vw;height:100vh;touch-action:manipulation;}
  .hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;
    background:rgba(15,27,44,.48);border:1px solid rgba(138,151,166,.35);backdrop-filter:blur(10px);
    border-radius:14px;padding:8px 18px 9px;color:var(--day);}
  .hud .brand{font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,2.4vw,1.4rem);line-height:1.12;}
  .hud .brand em{font-style:italic;color:var(--gold);}
  .hud .brand .sep{color:var(--mist);font-weight:400;padding:0 4px;}
  .hud .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);margin-top:3px;}
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;display:flex;gap:8px;align-items:center;
    background:rgba(15,27,44,.55);border:1px solid rgba(138,151,166,.35);backdrop-filter:blur(10px);
    border-radius:14px;padding:7px 10px;max-width:96vw;flex-wrap:wrap;justify-content:center;}
  .bar button,.bar select{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    background:var(--dawn);color:var(--ink);border:none;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;}
  .bar button.ghost,.bar select{background:transparent;color:var(--day);border:1px solid rgba(138,151,166,.5);}
  .bar select{appearance:none;-webkit-appearance:none;text-align:center;}
  .bar select option{color:#14100A;}
  .bar .stat{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);padding:0 6px;min-width:7ch;text-align:center;}
  .rail{position:fixed;z-index:4;display:flex;align-items:center;gap:6px;justify-content:center;
    pointer-events:none;height:30px;font-family:var(--mono);}
  .rail .slot{display:flex;align-items:center;gap:1px;}
  .rail img{display:block;width:24px;height:24px;}
  .rail .n{font-size:.58rem;color:var(--mist);letter-spacing:.05em;margin-right:4px;}
  .rail .side{font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--day-2);font-weight:600;
    background:rgba(15,27,44,.55);border:1px solid rgba(138,151,166,.35);border-radius:7px;padding:3px 7px;margin-right:6px;}
  .rail .mat{font-size:.62rem;color:var(--gold);letter-spacing:.08em;margin-left:8px;font-weight:600;}
  .panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(15,27,44,.92);border:1px solid rgba(242,184,75,.45);border-radius:18px;
    backdrop-filter:blur(12px);padding:22px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.5);}
  .panel.hidden{display:none;}
  .panel h2{font-family:var(--display);font-weight:600;font-size:1.5rem;margin-bottom:4px;}
  .panel h2 em{font-style:italic;color:var(--gold);}
  .panel .sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);margin-bottom:14px;}
  .panel .record{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;color:var(--day-2);margin:10px 0 16px;}
  .panel button{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
    background:var(--dawn);color:var(--ink);border:none;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:600;}
  #promo .opts{display:flex;gap:12px;justify-content:center;}
  #promo .opt{background:rgba(251,247,238,.08);border:1px solid rgba(138,151,166,.4);border-radius:12px;
    padding:8px 10px 6px;cursor:pointer;transition:border-color .15s,background .15s;}
  #promo .opt:hover,#promo .opt:focus-visible{border-color:var(--gold);background:rgba(242,184,75,.14);outline:none;}
  #promo .opt img{width:44px;height:44px;display:block;}
  #promo .opt span{font-family:var(--mono);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);}
  #keyRows{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin:6px 0 18px;text-align:left;}
  #keyRows .krow{display:flex;align-items:center;gap:10px;}
  #keyRows img{width:40px;height:40px;display:block;}
  #keyRows .an{font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--day);}
  #keyRows .pn{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  @media (max-width:480px){ #keyRows{grid-template-columns:1fr;} }
  #dim{position:fixed;inset:0;background:rgba(15,27,44,.55);z-index:15;transition:opacity .26s;}
  #dim.hidden{display:none;}
</style>
</head>
<body>
<canvas id="board"></canvas>
<div class="hud">
  <div class="brand">Boot Camp <em>FX</em><span class="sep">·</span>Chess</div>
  <div class="tag" id="hudTag">Ink to move</div>
</div>
<div class="rail" id="railTop" aria-live="polite"></div>
<div class="rail" id="railBot" aria-live="polite"></div>
<div class="bar">
  <button type="button" id="btnNew">New game</button>
  <button type="button" class="ghost" id="btnUndo" title="Take back a move">Undo</button>
  <button type="button" class="ghost" id="btnHint" title="Show a good move">Hint</button>
  <button type="button" class="ghost" id="btnFlip" title="Flip the board">Flip</button>
  <button type="button" class="ghost" id="btnMode">vs AI</button>
  <select id="selDiff" title="AI difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>
  <button type="button" class="ghost" id="btnSound" title="Sound on/off">Sound</button>
  <button type="button" class="ghost" id="btnKey" title="Which animal is which piece">Key</button>
  <div class="stat" id="hudStat">your move</div>
</div>
<div id="dim" class="hidden"></div>
<div class="panel hidden" id="promo" role="dialog" aria-label="Choose promotion">
  <h2>Promote the <em>turtle</em></h2>
  <div class="sub">choose its new form</div>
  <div class="opts" id="promoOpts"></div>
</div>
<div class="panel hidden" id="keyPanel" role="dialog" aria-label="Piece key">
  <h2>The <em>wilds</em> key</h2>
  <div class="sub">who plays which piece</div>
  <div id="keyRows"></div>
  <button type="button" id="btnKeyClose">Close</button>
</div>
<div class="panel hidden" id="endPanel" role="dialog" aria-label="Game over">
  <h2 id="endTitle">Checkmate</h2>
  <div class="sub" id="endSub"></div>
  <div class="record" id="endRecord"></div>
  <button type="button" id="btnAgain">Play again</button>
</div>
<script>
(function(){
"use strict";

var cv = document.getElementById('board');
var ctx = cv.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W = 0, H = 0;
var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var C = {
  predawn:'#0F1B2C', predawn2:'#16273D', pine:'#14291F',
  dawn:'#E8933A', gold:'#F2B84B', day:'#FBF7EE', day2:'#F3ECDC',
  ink:'#14100A', mist:'#9FB0C4', stone:'#6A6255',
  lineDay:'#E4DAC6', steel:'#8A97A6', skyHi:'#2C3A50',
  toad:'#6E7E33', toadDark:'#55632A', cream:'#F3ECDC'
};

var ANIMAL = { king:'Owl', queen:'Squirrel', rook:'Rabbit', knight:'Coyote', bishop:'Bumblebee', pawn:'Turtle' };

var DAY_LOOP = 86;
var skyT = 0;
function dayF(){ return 0.5 - 0.5 * Math.cos(skyT * 2 * Math.PI / DAY_LOOP); }

var sq = 0, bx = 0, by = 0, board = 0;
function layout(){
  var reserved = 168;
  board = Math.max(200, Math.min(W - 8, H - reserved));
  sq = board / 8;
  bx = Math.round((W - board) / 2);
  by = Math.round(58 + (H - reserved - board) / 2);
  placeRails();
}
function placeRails(){
  var rt = document.getElementById('railTop'), rb = document.getElementById('railBot');
  if (!rt || !board) return;
  rt.style.left = bx + 'px'; rt.style.width = board + 'px'; rt.style.top = Math.max(52, by - 34) + 'px';
  rb.style.left = bx + 'px'; rb.style.width = board + 'px'; rb.style.top = (by + board + 5) + 'px';
}
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);

function rnd(a, b){ return a + Math.random() * (b - a); }
function lerpColor(c1, c2, t){
  var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  var ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  var br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return 'rgb(' + Math.round(ar+(br-ar)*t) + ',' + Math.round(ag+(bg-ag)*t) + ',' + Math.round(ab+(bb-ab)*t) + ')';
}
function easeIO(u){ return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2) / 2; }
function anim(now, dur, keys){
  var t = (now % dur) / dur;
  for (var i = 0; i < keys.length - 1; i++){
    var a = keys[i], b = keys[i+1];
    if (t >= a[0] && t <= b[0]){
      var seg = (b[0] - a[0]) || 1;
      var u = easeIO((t - a[0]) / seg);
      return a[1] + (b[1] - a[1]) * u;
    }
  }
  return keys[keys.length-1][1];
}
function poly(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

/* ---------- cute face (runner language) ---------- */
function face(x, y, r, inkPupil){
  ctx.fillStyle = C.day;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(x + r * 0.08, y + r * 0.06, r * (inkPupil || 0.38), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.day;
  ctx.beginPath(); ctx.arc(x - r * 0.28, y - r * 0.32, r * 0.18, 0, Math.PI * 2); ctx.fill();
}

function tint(hex, side){
  if (side === 'w') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return 'rgb(' + Math.round(r*0.55) + ',' + Math.round(g*0.55) + ',' + Math.round(b*0.55) + ')';
}

var BACK = ['rook','knight','bishop','queen','king','bishop','knight','rook'];
var pieces = [];
var nextId = 1;
function resetPieces(){
  pieces = [];
  nextId = 1;
  for (var f = 0; f < 8; f++){
    pieces.push({ id:nextId++, file:f, rank:1, type:'pawn',  side:'w', ph:(f*0.9 + 1.7) % 6.283, moved:false, dir:1 });
    pieces.push({ id:nextId++, file:f, rank:6, type:'pawn',  side:'b', ph:(f*1.3 + 0.4) % 6.283, moved:false, dir:1 });
    pieces.push({ id:nextId++, file:f, rank:0, type:BACK[f], side:'w', ph:(f*0.6 + 2.2) % 6.283, moved:false, dir:1 });
    pieces.push({ id:nextId++, file:f, rank:7, type:BACK[f], side:'b', ph:(f*1.1 + 4.1) % 6.283, moved:false, dir:1 });
  }
}
resetPieces();

/* Scale so tallest (king) fills ~88% of a square. Local units: feet at y=0, head negative. */
function scaleFor(type){
  var h = { king:76, queen:46, rook:46, knight:48, bishop:36, pawn:38 }[type] || 50;
  var fill = { king:0.92, queen:0.82, rook:0.74, knight:0.74, bishop:0.70, pawn:0.56 }[type] || 0.7;
  return (sq * fill) / h;
}

/* ---------- crown: gold zigzag, worn by owl (large) and squirrel (small) ---------- */
function drawCrown(cx, baseY, w, h){
  ctx.fillStyle = C.gold;
  ctx.beginPath();
  ctx.moveTo(cx - w/2, baseY);
  ctx.lineTo(cx - w/2, baseY - h*0.55);
  ctx.lineTo(cx - w/4, baseY - h*0.32);
  ctx.lineTo(cx, baseY - h);
  ctx.lineTo(cx + w/4, baseY - h*0.32);
  ctx.lineTo(cx + w/2, baseY - h*0.55);
  ctx.lineTo(cx + w/2, baseY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#B97A1E'; ctx.lineWidth = Math.max(0.7, h * 0.09);
  ctx.stroke();
  ctx.fillStyle = C.dawn;
  ctx.beginPath(); ctx.arc(cx, baseY - h, h * 0.13, 0, Math.PI * 2); ctx.fill();
}

/* ---------- King = Owl ---------- */
function drawOwl(t, side){
  var sway = RM ? 0 : anim(t, 5.4, [[0,0],[0.28,6],[0.62,-4],[1,0]]);
  var blink = RM ? 1 : anim(t, 4.2, [[0,1],[0.96,1],[0.98,0.1],[1,1]]);
  ctx.save();
  ctx.translate(-32, -76);
  ctx.translate(32, 50);
  ctx.rotate(sway * Math.PI / 180);
  ctx.translate(-32, -50);
  ctx.fillStyle = tint(C.mist, side);
  ctx.beginPath(); ctx.ellipse(32, 50, 18, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(32, 26, 17, 0, Math.PI * 2); ctx.fill();
  poly([[19,14],[14,0],[22,12]]);
  poly([[45,14],[50,0],[42,12]]);
  drawCrown(32, 12, 27, 16);
  var flap = RM ? 0 : Math.sin(t * 1.3) * 2.4;
  ctx.fillStyle = '#7A8A9A';
  ctx.save(); ctx.translate(16, 36); ctx.rotate(-flap * Math.PI / 180); ctx.translate(-16, -36);
  ctx.beginPath(); ctx.moveTo(16, 36); ctx.bezierCurveTo(12, 46, 12, 58, 18, 62); ctx.lineTo(18, 40); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(48, 36); ctx.rotate(flap * Math.PI / 180); ctx.translate(-48, -36);
  ctx.beginPath(); ctx.moveTo(48, 36); ctx.bezierCurveTo(52, 46, 52, 58, 46, 62); ctx.lineTo(46, 40); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(32, 24); ctx.scale(1, blink); ctx.translate(-32, -24);
  face(25, 24, 6.4); face(39, 24, 6.4);
  ctx.restore();
  ctx.fillStyle = C.dawn;
  poly([[32,29],[28,36],[32,34],[36,36]]);
  ctx.strokeStyle = C.dawn; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(24,70); ctx.lineTo(24,76);
  ctx.moveTo(22,70); ctx.lineTo(22,76);
  ctx.moveTo(26,70); ctx.lineTo(26,76);
  ctx.moveTo(40,70); ctx.lineTo(40,76);
  ctx.moveTo(38,70); ctx.lineTo(38,76);
  ctx.moveTo(42,70); ctx.lineTo(42,76);
  ctx.stroke();
  ctx.restore();
}

/* ---------- Queen = Squirrel ---------- */
function drawSquirrel(t, side){
  var flick = RM ? 0 : Math.sin(t * 2.2) * 4;
  ctx.save();
  ctx.translate(-26, -46);
  ctx.fillStyle = tint(C.dawn, side);
  ctx.save();
  ctx.translate(38, 18); ctx.rotate(flick * Math.PI / 180); ctx.translate(-38, -18);
  ctx.beginPath(); ctx.arc(38, 18, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = tint('#D07F2E', side);
  ctx.beginPath(); ctx.arc(41, 14, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = tint(C.dawn, side);
  poly([[14,26],[10,30],[10,38],[14,44],[24,46],[34,46],[40,42],[40,34],[36,27],[28,24],[20,23]]);
  ctx.beginPath(); ctx.arc(14, 21, 6.5, 0, Math.PI * 2); ctx.fill();
  poly([[11,16],[9,9],[13,12]]);
  drawCrown(14, 15, 11, 7);
  face(12.4, 19.2, 3.4);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(9.2, 22.2, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.dawn; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(16,46); ctx.lineTo(13,46); ctx.moveTo(32,46); ctx.lineTo(36,46); ctx.stroke();
  ctx.restore();
}

/* ---------- Rook = Rabbit ---------- */
function drawRabbit(t, side){
  var twitch = RM ? 0 : anim(t, 2.6, [[0,0],[0.88,0],[0.92,-8],[0.96,4],[1,0]]);
  ctx.save();
  ctx.translate(-26, -46);
  ctx.fillStyle = tint(C.stone, side);
  ctx.save();
  ctx.translate(23, 14); ctx.rotate(twitch * Math.PI / 180); ctx.translate(-23, -14);
  poly([[20,14],[17,6],[17,1],[20,0],[23,1],[23,8],[23,14]]);
  ctx.globalAlpha = 0.75;
  poly([[26,14],[25,5],[26,1],[29,1],[31,3],[30,9],[29,14]]);
  ctx.globalAlpha = 1;
  ctx.restore();
  poly([[18,22],[12,24],[8,30],[9,36],[10,43],[18,46],[28,46],[38,46],[44,42],[44,35],[44,28],[38,22],[30,21]]);
  ctx.beginPath(); ctx.arc(16, 22, 6, 0, Math.PI * 2); ctx.fill();
  face(14.2, 20.2, 3.6);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.ellipse(12.2, 23.6, 1.4, 1.0, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.day2;
  ctx.fillRect(12.4, 24.6, 1.2, 2.2);
  ctx.fillRect(14.0, 24.6, 1.2, 2.2);
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.arc(45, 40, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.dawn; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12,46); ctx.lineTo(8,46); ctx.moveTo(34,46); ctx.lineTo(40,46); ctx.stroke();
  ctx.restore();
}

/* ---------- Knight = Coyote ---------- */
function drawCoyote(t, side){
  var sway = RM ? 0 : Math.sin(t * 0.9) * 1.3;
  ctx.save();
  ctx.scale(-1, 1);
  ctx.scale(0.36, 0.36);
  ctx.translate(-160, -166);
  ctx.translate(132, 120);
  ctx.rotate(sway * Math.PI / 180);
  ctx.translate(-132, -120);
  ctx.fillStyle = tint('#8F8068', side);
  ctx.beginPath(); roundRect(73, 122, 10, 44, 3); ctx.fill();
  ctx.beginPath(); roundRect(127, 126, 10, 40, 3); ctx.fill();
  ctx.fillStyle = tint('#9C8B70', side);
  ctx.beginPath();
  ctx.moveTo(74,100); ctx.bezierCurveTo(84,88,102,82,122,82); ctx.bezierCurveTo(144,82,162,86,172,92);
  ctx.bezierCurveTo(182,96,186,102,184,110); ctx.bezierCurveTo(182,118,172,122,162,122);
  ctx.bezierCurveTo(150,126,140,126,128,126); ctx.bezierCurveTo(112,126,98,126,92,122);
  ctx.bezierCurveTo(84,118,76,110,74,100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = tint('#6E5F49', side);
  ctx.beginPath();
  ctx.moveTo(80,98); ctx.bezierCurveTo(92,88,108,84,126,84); ctx.bezierCurveTo(146,84,160,88,170,93);
  ctx.bezierCurveTo(156,97,132,97,112,97); ctx.bezierCurveTo(98,97,88,98,80,98); ctx.closePath(); ctx.fill();
  ctx.fillStyle = tint('#9C8B70', side);
  ctx.beginPath(); roundRect(83, 124, 10, 42, 3); ctx.fill();
  ctx.beginPath(); roundRect(149, 124, 10, 42, 3); ctx.fill();
  ctx.fillStyle = tint('#6E5F49', side);
  ctx.beginPath();
  ctx.moveTo(74,106); ctx.bezierCurveTo(56,104,36,110,24,124); ctx.bezierCurveTo(16,133,14,144,20,150);
  ctx.bezierCurveTo(27,157,40,154,52,144); ctx.bezierCurveTo(62,136,72,126,78,116); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.dawn;
  ctx.beginPath(); ctx.arc(28, 148, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = tint('#9C8B70', side);
  ctx.beginPath();
  ctx.moveTo(160,92); ctx.bezierCurveTo(168,78,180,68,194,66); ctx.bezierCurveTo(206,64,214,70,220,76);
  ctx.lineTo(240,88); ctx.bezierCurveTo(246,91,248,95,246,98); ctx.bezierCurveTo(243,101,236,101,228,99);
  ctx.lineTo(204,94); ctx.bezierCurveTo(196,100,186,106,176,108); ctx.bezierCurveTo(166,110,156,102,160,92);

/* ---------- move engine ---------- */
function copyList(list){
  var o = [];
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    o.push({ id:p.id, file:p.file, rank:p.rank, type:p.type, side:p.side, ph:p.ph, moved:p.moved, dir:p.dir });
  }
  return o;
}
function occ(f, r, list){
  for (var i = 0; i < list.length; i++) if (list[i].file === f && list[i].rank === r) return list[i];
  return null;
}
function onBoard(f, r){ return f >= 0 && f < 8 && r >= 0 && r < 8; }
function enemy(side){ return side === 'w' ? 'b' : 'w'; }
function mv(p, f, r, extra){
  var m = { pid:p.id, f:f, r:r, capture:null, castle:null, ep:false, promote:false, promoteAs:'queen' };
  if (extra) for (var k in extra) m[k] = extra[k];
  return m;
}

function genPseudo(side, list, asAttack){
  var out = [];
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    if (p.side !== side) continue;
    if (p.type === 'pawn'){
      var dir = p.side === 'w' ? 1 : -1;
      var start = p.side === 'w' ? 1 : 6;
      var df;
      if (asAttack){
        for (df = -1; df <= 1; df += 2){
          if (onBoard(p.file + df, p.rank + dir)) out.push(mv(p, p.file + df, p.rank + dir));
        }
      } else {
        var f1 = p.file, r1 = p.rank + dir;
        if (onBoard(f1, r1) && !occ(f1, r1, list)){
          out.push(mv(p, f1, r1, { promote: r1 === 0 || r1 === 7 }));
          var r2 = p.rank + dir * 2;
          if (p.rank === start && !occ(f1, r2, list)) out.push(mv(p, f1, r2));
        }
        for (df = -1; df <= 1; df += 2){
          var cf = p.file + df, cr = p.rank + dir;
          if (!onBoard(cf, cr)) continue;
          var o = occ(cf, cr, list);
          if (o && o.side !== p.side) out.push(mv(p, cf, cr, { capture:o.id, promote: cr === 0 || cr === 7 }));
          if (ep && ep.f === cf && ep.r === cr){
            var vic = occ(cf, p.rank, list);
            if (vic && vic.side !== p.side && vic.type === 'pawn')
              out.push(mv(p, cf, cr, { capture:vic.id, ep:true }));
          }
        }
      }
    } else if (p.type === 'knight'){
      var N = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
      for (var n = 0; n < 8; n++){
        var nf = p.file + N[n][0], nr = p.rank + N[n][1];
        if (!onBoard(nf, nr)) continue;
        var no = occ(nf, nr, list);
        if (!no || no.side !== p.side) out.push(mv(p, nf, nr, no ? { capture:no.id } : null));
      }
    } else if (p.type === 'bishop' || p.type === 'rook' || p.type === 'queen'){
      var D = [];
      if (p.type !== 'rook') D.push([1,1],[1,-1],[-1,-1],[-1,1]);
      if (p.type !== 'bishop') D.push([1,0],[-1,0],[0,1],[0,-1]);
      for (var d = 0; d < D.length; d++){
        var f = p.file, r = p.rank;
        for (;;){
          f += D[d][0]; r += D[d][1];
          if (!onBoard(f, r)) break;
          var so = occ(f, r, list);
          if (!so) out.push(mv(p, f, r));
          else { if (so.side !== p.side) out.push(mv(p, f, r, { capture:so.id })); break; }
        }
      }
    } else if (p.type === 'king'){
      for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++){
        if (!dx && !dy) continue;
        var kf = p.file + dx, kr = p.rank + dy;
        if (!onBoard(kf, kr)) continue;
        var ko = occ(kf, kr, list);
        if (!ko || ko.side !== p.side) out.push(mv(p, kf, kr, ko ? { capture:ko.id } : null));
      }
    }
  }
  return out;
}

function applyMove(list, m, liveEp, liveCastle){
  var nxt = copyList(list);
  var p = null, i;
  for (i = 0; i < nxt.length; i++) if (nxt[i].id === m.pid) p = nxt[i];
  if (!p) return { list:nxt, ep:null, castle:liveCastle };
  if (m.capture){
    var keep = [];
    for (i = 0; i < nxt.length; i++) if (nxt[i].id !== m.capture) keep.push(nxt[i]);
    nxt = keep;
    for (i = 0; i < nxt.length; i++) if (nxt[i].id === m.pid) p = nxt[i];
  }
  var fromF = p.file, fromR = p.rank;
  p.dir = (m.f > fromF) ? -1 : (m.f < fromF) ? 1 : (p.dir || 1);
  p.file = m.f; p.rank = m.r; p.moved = true;
  if (m.promote) p.type = m.promoteAs || 'queen';
  if (m.castle === 'K'){
    for (i = 0; i < nxt.length; i++) if (nxt[i].side === p.side && nxt[i].type === 'rook' && nxt[i].file === 7){ nxt[i].file = 5; nxt[i].moved = true; nxt[i].dir = 1; }
  }
  if (m.castle === 'Q'){
    for (i = 0; i < nxt.length; i++) if (nxt[i].side === p.side && nxt[i].type === 'rook' && nxt[i].file === 0){ nxt[i].file = 3; nxt[i].moved = true; nxt[i].dir = -1; }
  }
  var newEp = null;
  if (p.type === 'pawn' && Math.abs(m.r - fromR) === 2) newEp = { f:fromF, r:(fromR + m.r) / 2 };
  var cst = { wK:liveCastle.wK, wQ:liveCastle.wQ, bK:liveCastle.bK, bQ:liveCastle.bQ };
  if (p.type === 'king'){
    if (p.side === 'w'){ cst.wK = false; cst.wQ = false; }
    else { cst.bK = false; cst.bQ = false; }
  }
  if (p.type === 'rook'){
    if (p.side === 'w' && fromF === 7 && fromR === 0) cst.wK = false;
    if (p.side === 'w' && fromF === 0 && fromR === 0) cst.wQ = false;
    if (p.side === 'b' && fromF === 7 && fromR === 7) cst.bK = false;
    if (p.side === 'b' && fromF === 0 && fromR === 7) cst.bQ = false;
  }
  if (m.capture){
    if (m.f === 7 && m.r === 0) cst.wK = false;
    if (m.f === 0 && m.r === 0) cst.wQ = false;
    if (m.f === 7 && m.r === 7) cst.bK = false;
    if (m.f === 0 && m.r === 7) cst.bQ = false;
  }
  return { list:nxt, ep:newEp, castle:cst };
}

function kingOf(side, list){
  for (var i = 0; i < list.length; i++) if (list[i].type === 'king' && list[i].side === side) return list[i];
  return null;
}
function inCheck(side, list){
  var k = kingOf(side, list);
  if (!k) return true;
  var atk = genPseudo(enemy(side), list, true);
  for (var i = 0; i < atk.length; i++) if (atk[i].f === k.file && atk[i].r === k.rank) return true;
  return false;
}

function addCastles(side, list, out){
  var k = kingOf(side, list);
  if (!k || k.moved) return;
  var rank = side === 'w' ? 0 : 7;
  if (k.file !== 4 || k.rank !== rank) return;
  if (inCheck(side, list)) return;
  var rightsK = side === 'w' ? castle.wK : castle.bK;
  var rightsQ = side === 'w' ? castle.wQ : castle.bQ;
  var them = enemy(side);
  if (rightsK && !occ(5, rank, list) && !occ(6, rank, list)){
    var rookH = occ(7, rank, list);
    if (rookH && rookH.type === 'rook' && rookH.side === side && !rookH.moved){
      var ok = true;
      var atk = genPseudo(them, list, true);
      for (var i = 0; i < atk.length; i++) if ((atk[i].f === 5 || atk[i].f === 6) && atk[i].r === rank) ok = false;
      if (ok) out.push(mv(k, 6, rank, { castle:'K' }));
    }
  }
  if (rightsQ && !occ(3, rank, list) && !occ(2, rank, list) && !occ(1, rank, list)){
    var rookA = occ(0, rank, list);
    if (rookA && rookA.type === 'rook' && rookA.side === side && !rookA.moved){
      var ok2 = true;
      var atk2 = genPseudo(them, list, true);
      for (var j = 0; j < atk2.length; j++) if ((atk2[j].f === 3 || atk2[j].f === 2) && atk2[j].r === rank) ok2 = false;
      if (ok2) out.push(mv(k, 2, rank, { castle:'Q' }));
    }
  }
}

function legalMoves(side, list, liveEp, liveCastle){
  list = list || pieces;
  liveEp = liveEp === undefined ? ep : liveEp;
  liveCastle = liveCastle || castle;
  var savedEp = ep, savedC = castle;
  ep = liveEp; castle = liveCastle;
  var raw = genPseudo(side, list, false);
  addCastles(side, list, raw);
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var sim = applyMove(list, raw[i], liveEp, liveCastle);
    if (!inCheck(side, sim.list)) out.push(raw[i]);
  }
  ep = savedEp; castle = savedC;
  return out;
}

function findPiece(id){
  for (var i = 0; i < pieces.length; i++) if (pieces[i].id === id) return pieces[i];
  return null;
}

function insufficientMaterial(list){
  var rest = [];
  for (var i = 0; i < list.length; i++) if (list[i].type !== 'king') rest.push(list[i]);
  if (!rest.length) return true;
  if (rest.length === 1 && (rest[0].type === 'bishop' || rest[0].type === 'knight')) return true;
  return false;
}

/* ---------- history / undo ---------- */
function snapshot(){
  return {
    pieces: copyList(pieces), turn:turn, ep:ep,
    castle:{ wK:castle.wK, wQ:castle.wQ, bK:castle.bK, bQ:castle.bQ },
    capturedByW: capturedByW.slice(), capturedByB: capturedByB.slice(),
    plyCount: plyCount, nextId: nextId, tagText: hudTag.textContent
  };
}
function restoreSnap(s){
  pieces = copyList(s.pieces);
  turn = s.turn; ep = s.ep; castle = s.castle;
  capturedByW = s.capturedByW.slice(); capturedByB = s.capturedByB.slice();
  plyCount = s.plyCount; nextId = s.nextId;
  STATE = 'play'; gameCounted = true;
  selected = null; legal = []; hop = null; departing = []; flashes = []; flights = [];
  mateAnim = null; lastMove = null; hintMove = null; promoMoves = null;
  checkSide = inCheck(turn, pieces) ? turn : null;
  hidePanels();
  setStatus(s.tagText);
  updateRails();
  persist();
}
function undo(){
  if (!history.length || promoMoves) return;
  var s = history.pop();
  if (vsAI && s.turn === 'b' && history.length) s = history.pop();
  restoreSnap(s);
  sfx('select');
}

/* ---------- status / flavor ---------- */
function sideName(side){ return side === 'w' ? 'Ink' : 'Stone'; }
function setStatus(s){
  if (hudTag) hudTag.textContent = s;
  if (hudStat && STATE !== 'over') hudStat.textContent = vsAI ? (turn === 'w' ? 'your move' : 'thinking…') : s;
}
function flavor(cap, mover){
  if (!cap) return;
  var msg = ANIMAL[mover.type] + ' takes ' + ANIMAL[cap.type].toLowerCase() + '!';
  if (hudStat) hudStat.textContent = msg;
}

/* ---------- capture flight to the Pound ---------- */
function launchFlight(cap){
  var pos = cellXY(vF(cap.file), vR(cap.rank));
  var toTop = cap.side === 'w'; /* white animal captured by black -> top rail */
  flights.push({
    spr: renderSprite(cap.type, cap.side, 48, true),
    x0: pos.x, y0: pos.y - sq * 0.4,
    x1: bx + board / 2 + rnd(-40, 40), y1: toTop ? Math.max(52, by - 20) : by + board + 18,
    t: 0, dur: 0.3
  });
}

/* ---------- core move ---------- */
function doMove(m){
  if (STATE !== 'play' || hop) return;
  var p = findPiece(m.pid);
  if (!p) return;
  history.push(snapshot());
  if (history.length > 200) history.shift();
  var fromF = p.file, fromR = p.rank;
  var cap = m.capture ? findPiece(m.capture) : null;
  if (cap){
    fadeOut(cap);
    launchFlight(cap);
    if (cap.side === 'b') capturedByW.push(cap.type); else capturedByB.push(cap.type);
  }
  flashes.push({ f:m.f, r:m.r, t:0.28 });
  var sim = applyMove(pieces, m, ep, castle);
  pieces = sim.list;
  ep = sim.ep;
  castle = sim.castle;
  plyCount++;
  lastMove = { f0:fromF, r0:fromR, f1:m.f, r1:m.r };
  var mover = findPiece(m.pid);
  if (mover && !RM){
    hop = { id:m.pid, f0:fromF, r0:fromR, f1:m.f, r1:m.r, t:0, dur:0.16 };
  }
  selected = null;
  legal = [];
  hintMove = null;
  turn = enemy(turn);
  sfx(cap ? 'capture' : (m.promote ? 'promo' : 'move'));
  flavor(cap, p);
  updateRails();
  checkSide = null;
  var moves = legalMoves(turn);
  if (!moves.length){
    STATE = 'over';
    if (inCheck(turn, pieces)){
      var winner = enemy(turn);
      setStatus(sideName(winner) + ' wins — ' + sideName(turn).toLowerCase() + ' is mated');
      mateAnim = { side: turn, t: 0, dur: 0.6 };
      endGame(winner === 'w' ? 'win' : 'lose', 'checkmate');
    } else {
      setStatus('stalemate — the forest holds its breath');
      endGame('draw', 'stalemate');
    }
  } else if (insufficientMaterial(pieces)){
    STATE = 'over';
    setStatus('draw — only the owl and whispers remain');
    endGame('draw', 'bare kings');
  } else {
    if (inCheck(turn, pieces)){ checkSide = turn; setStatus(sideName(turn) + ' in check'); sfx('check'); }
    else setStatus(sideName(turn) + ' to move');
    if (vsAI && turn === 'b' && STATE === 'play') aiWait = RM ? 0.05 : 0.42;
  }
  persist();
}

/* ---------- AI ---------- */
function scoreMove(m){
  var s = 0;
  if (m.capture){
    var c = findPiece(m.capture);
    if (c) s += VAL[c.type] || 0;
  }
  if (m.promote) s += 800;
  s += (4 - Math.abs(m.f - 3.5)) * 4 + (4 - Math.abs(m.r - 3.5)) * 2;
  var sim = applyMove(pieces, m, ep, castle);
  if (inCheck(enemy(turn), sim.list)) s += 40;
  var replies = legalMoves(enemy(turn), sim.list, sim.ep, sim.castle);
  var hang = 0;
  for (var i = 0; i < replies.length; i++){
    if (replies[i].capture === m.pid){
      var me = findPiece(m.pid);
      hang = Math.max(hang, VAL[me.type] || 0);
    }
  }
  s -= hang * 0.9;
  return s;
}

function evalList(list){
  var s = 0;
  for (var i = 0; i < list.length; i++){
    var p = list[i];
    var v = VAL[p.type] || 0;
    v += ((3.5 - Math.abs(p.file - 3.5)) + (3.5 - Math.abs(p.rank - 3.5))) * 3;
    s += p.side === 'w' ? v : -v;
  }
  return s;
}
function search(side, list, epS, castleS, depth, alpha, beta){
  var moves = legalMoves(side, list, epS, castleS);
  if (!moves.length){
    if (inCheck(side, list)) return side === 'w' ? -90000 - depth : 90000 + depth;
    return 0;
  }
  if (depth === 0) return evalList(list);
  moves.sort(function(a, b){ return (b.capture ? 1 : 0) - (a.capture ? 1 : 0); });
  var i, sim, v;
  if (side === 'w'){
    var best = -1e9;
    for (i = 0; i < moves.length; i++){
      sim = applyMove(list, moves[i], epS, castleS);
      v = search('b', sim.list, sim.ep, sim.castle, depth - 1, alpha, beta);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (beta <= alpha) break;
    }
    return best;
  }
  var bestB = 1e9;
  for (i = 0; i < moves.length; i++){
    sim = applyMove(list, moves[i], epS, castleS);
    v = search('w', sim.list, sim.ep, sim.castle, depth - 1, alpha, beta);
    if (v < bestB) bestB = v;
    if (v < beta) beta = v;
    if (beta <= alpha) break;
  }
  return bestB;
}
function bestMoveDeep(side, depth){
  var moves = legalMoves(side);
  if (!moves.length) return null;
  moves.sort(function(a, b){ return (b.capture ? 1 : 0) - (a.capture ? 1 : 0); });
  var best = side === 'w' ? -1e9 : 1e9, pool = [], tol = 30;
  for (var i = 0; i < moves.length; i++){
    var sim = applyMove(pieces, moves[i], ep, castle);
    var v = search(enemy(side), sim.list, sim.ep, sim.castle, depth - 1, -1e9, 1e9);
    var better = side === 'w' ? (v > best + tol) : (v < best - tol);
    var tied = Math.abs(v - best) <= tol;
    if (!pool.length || better){ best = v; pool = [moves[i]]; }
    else if (tied) pool.push(moves[i]);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function aiPick(){
  var moves = legalMoves('b');
  if (!moves.length) return null;
  if (difficulty === 'hard') return bestMoveDeep('b', 3) || moves[0];
  if (difficulty === 'easy'){
    if (Math.random() < 0.35) return moves[Math.floor(Math.random() * moves.length)];
    var bestE = -1e9, poolE = [];
    for (var e = 0; e < moves.length; e++){
      var scE = scoreMove(moves[e]);
      if (scE > bestE + 60){ bestE = scE; poolE = [moves[e]]; }
      else if (Math.abs(scE - bestE) <= 60) poolE.push(moves[e]);
    }
    return poolE[Math.floor(Math.random() * poolE.length)];
  }
  var best = -1e9, pool = [];
  for (var i = 0; i < moves.length; i++){
    var sc = scoreMove(moves[i]);
    if (sc > best + 8){ best = sc; pool = [moves[i]]; }
    else if (Math.abs(sc - best) <= 8) pool.push(moves[i]);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ---------- input ---------- */
function sqFromEvent(e){
  var x = e.clientX, y = e.clientY;
  var f = Math.floor((x - bx) / sq);
  var r = Math.floor((y - by) / sq);
  if (f < 0 || f > 7 || r < 0 || r > 7) return null;
  return { f: vF(f), r: vR(r) };
}

function onPointer(e){
  unlockAudio();
  if (hop) hop = null;
  if (STATE !== 'play' || promoMoves) return;
  if (vsAI && turn === 'b') return;
  var sqp = sqFromEvent(e);
  if (!sqp){ selected = null; legal = []; return; }
  if (selected){
    var chosen = [];
    for (var i = 0; i < legal.length; i++){
      if (legal[i].f === sqp.f && legal[i].r === sqp.r) chosen.push(legal[i]);
    }
    if (chosen.length){
      if (chosen[0].promote){
        var variants = [];
        ['queen','rook','bishop','knight'].forEach(function(t){
          var c = {};
          for (var k in chosen[0]) c[k] = chosen[0][k];
          c.promoteAs = t;
          variants.push(c);
        });
        openPromo(variants);
      } else {
        doMove(chosen[0]);
      }
      return;
    }
  }
  var p = occ(sqp.f, sqp.r, pieces);
  if (p && p.side === turn){
    selected = p;
    sfx('select');
    var all = legalMoves(turn);
    legal = [];
    for (var j = 0; j < all.length; j++) if (all[j].pid === p.id) legal.push(all[j]);
  } else {
    selected = null; legal = [];
  }
}

/* ---------- new game / persistence ---------- */
function newGame(){
  resetPieces();
  turn = 'w';
  selected = null;
  legal = [];
  ep = null;
  castle = { wK:true, wQ:true, bK:true, bQ:true };
  STATE = 'play';
  departing = [];
  flashes = [];
  flights = [];
  hop = null;
  aiWait = 0;
  history = [];
  capturedByW = [];
  capturedByB = [];
  lastMove = null;
  checkSide = null;
  hintMove = null;
  promoMoves = null;
  plyCount = 0;
  mateAnim = null;
  gameCounted = false;
  hidePanels();
  setStatus('Ink to move');
  updateRails();
  persist();
}

function persist(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      pieces: pieces, turn:turn, ep:ep, castle:castle, vsAI:vsAI, STATE:STATE, nextId:nextId,
      capturedByW:capturedByW, capturedByB:capturedByB, plyCount:plyCount,
      difficulty:difficulty, soundOn:soundOn, flipped:flipped, stats:stats
    }));
  } catch (e) {}
}
function restore(){
  try {
    var raw = localStorage.getItem(STORE);
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || !d.pieces || !d.pieces.length) return false;
    pieces = d.pieces; turn = d.turn; ep = d.ep; castle = d.castle;
    vsAI = !!d.vsAI; STATE = d.STATE || 'play'; nextId = d.nextId || 40;
    capturedByW = d.capturedByW || []; capturedByB = d.capturedByB || [];
    plyCount = d.plyCount || 0;
    difficulty = d.difficulty || 'medium';
    soundOn = d.soundOn !== false;
    flipped = !!d.flipped;
    if (d.stats) stats = d.stats;
    btnMode.textContent = vsAI ? 'vs AI' : '2 player';
    selDiff.value = difficulty;
    document.getElementById('btnSound').textContent = soundOn ? 'Sound' : 'Muted';
    checkSide = STATE === 'play' && inCheck(turn, pieces) ? turn : null;
    return true;
  } catch (e) { return false; }
}

/* ---------- the Pound (capture rails) ---------- */
function railHTML(list, ownSide){
  var counts = {};
  for (var i = 0; i < list.length; i++) counts[list[i]] = (counts[list[i]] || 0) + 1;
  var order = ['queen','rook','bishop','knight','pawn'];
  var html = '';
  for (var j = 0; j < order.length; j++){
    var t = order[j];
    if (!counts[t]) continue;
    html += '<span class="slot"><img src="' + spriteURL(t, ownSide, 24, true) + '" alt="' + ANIMAL[t] + '">';
    if (counts[t] > 1) html += '<span class="n">×' + counts[t] + '</span>';
    html += '</span>';
  }
  return html;
}
function material(){
  var s = 0, i;
  for (i = 0; i < capturedByW.length; i++) s += VAL[capturedByW[i]] || 0;
  for (i = 0; i < capturedByB.length; i++) s -= VAL[capturedByB[i]] || 0;
  return Math.round(s / 100);
}
function updateRails(){
  var rt = document.getElementById('railTop');
  var rb = document.getElementById('railBot');
  var m = material();
  rt.innerHTML = '<span class="side">Dark</span>' + railHTML(capturedByB, 'w') + (m < 0 ? '<span class="mat">+' + (-m) + '</span>' : '');
  rb.innerHTML = '<span class="side">Light</span>' + railHTML(capturedByW, 'b') + (m > 0 ? '<span class="mat">+' + m + '</span>' : '');
  rt.setAttribute('aria-label', 'Dark\'s captures' + (m < 0 ? ', ahead by ' + (-m) : ''));
  rb.setAttribute('aria-label', 'Light\'s captures' + (m > 0 ? ', ahead by ' + m : ''));
}

/* ---------- piece key ---------- */
var keyPanel = document.getElementById('keyPanel');
function buildKey(){
  var rows = document.getElementById('keyRows');
  rows.innerHTML = '';
  ['king','queen','rook','knight','bishop','pawn'].forEach(function(t){
    var d = document.createElement('div');
    d.className = 'krow';
    var img = document.createElement('img');
    img.src = spriteURL(t, 'w', 40);
    img.alt = ANIMAL[t];
    var txt = document.createElement('div');
    var an = document.createElement('div'); an.className = 'an'; an.textContent = ANIMAL[t];
    var pn = document.createElement('div'); pn.className = 'pn'; pn.textContent = t;
    txt.appendChild(an); txt.appendChild(pn);
    d.appendChild(img); d.appendChild(txt);
    rows.appendChild(d);
  });
}
document.getElementById('btnKey').addEventListener('click', function(e){
  e.stopPropagation(); unlockAudio();
  if (keyPanel.classList.contains('hidden')){
    hidePanels();
    buildKey();
    dim.classList.remove('hidden');
    keyPanel.classList.remove('hidden');
    sfx('select');
  } else {
    hidePanels();
  }
});
document.getElementById('btnKeyClose').addEventListener('click', function(e){
  e.stopPropagation(); hidePanels();
});
dim.addEventListener('click', function(){
  if (!keyPanel.classList.contains('hidden')) hidePanels();
});
cv.addEventListener('pointerdown', onPointer);

/* ---------- scenery ---------- */
var clouds = [], stars = [];
var geese = null, geeseTimer = 9;
function initScene(){
  clouds = []; stars = [];
  for (var i = 0; i < 5; i++) clouds.push({ x: rnd(0, W), y: rnd(H*0.05, H*0.28), s: rnd(0.5, 1.1), a: rnd(0.12, 0.28), v: rnd(4, 12) });
  for (var j = 0; j < 40; j++) stars.push({ x: rnd(0, W), y: rnd(0, H*0.32), a: rnd(0.15, 0.45), p: rnd(0, 6.3) });
}
function drawCloud(c){
  ctx.globalAlpha = c.a; ctx.fillStyle = C.mist;
  ctx.beginPath(); ctx.arc(c.x, c.y, 18*c.s, 0, Math.PI*2);
  ctx.arc(c.x+22*c.s, c.y+4, 14*c.s, 0, Math.PI*2);
  ctx.arc(c.x-18*c.s, c.y+6, 12*c.s, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function fadeOut(p){
  departing.push({
    type:p.type, side:p.side, ph:p.ph, dir:p.dir || 1,
    file:p.file, rank:p.rank, a:1, s:1, life: RM ? 0.01 : 0.28
  });
}

/* The sun climbs as the game unfolds: dawn arrives with the endgame. */
function skyFrac(){
  if (RM) return 0.45;
  var prog = Math.min(1, plyCount / 60);
  return Math.min(1, dayF() * 0.3 + prog * 0.68 + 0.04);
}

function update(dt){
  if (!RM){
    skyT += dt;
    for (var i = 0; i < clouds.length; i++){
      var c = clouds[i];
      c.x -= c.v * dt;
      if (c.x < -160){ c.x = W + rnd(0, 120); c.y = rnd(H*0.05, H*0.28); }
    }
    var now = performance.now() / 1000;
    if (skyFrac() > 0.55 && now > nextChirp){
      chirp();
      nextChirp = now + rnd(5, 13);
    }
    /* the Acacia Park pair drops by now and then */
    if (!geese){
      geeseTimer -= dt;
      if (geeseTimer <= 0) geese = { x: W + 140, y: rnd(H * 0.09, H * 0.26), t: 0 };
    } else {
      geese.x -= 52 * dt;
      geese.t += dt;
      if (geese.x < -220){ geese = null; geeseTimer = rnd(22, 40); }
    }
  }
  if (hop){
    hop.t += dt;
    if (hop.t >= hop.dur) hop = null;
  }
  if (mateAnim && mateAnim.t < mateAnim.dur) mateAnim.t += dt;
  if (hintT > 0){
    hintT -= dt;
    if (hintT <= 0) hintMove = null;
  }
  for (var d = departing.length - 1; d >= 0; d--){
    var g = departing[d];
    g.life -= dt;
    var u = Math.max(0, g.life / 0.28);
    g.a = u;
    g.s = 0.35 + 0.65 * u;
    if (g.life <= 0) departing.splice(d, 1);
  }
  for (var f = flashes.length - 1; f >= 0; f--){
    flashes[f].t -= dt;
    if (flashes[f].t <= 0) flashes.splice(f, 1);
  }
  for (var fl = flights.length - 1; fl >= 0; fl--){
    flights[fl].t += dt;
    if (flights[fl].t >= flights[fl].dur) flights.splice(fl, 1);
  }
  if (aiWait > 0 && !hop){
    aiWait -= dt;
    if (aiWait <= 0 && STATE === 'play' && vsAI && turn === 'b'){
      var pick = aiPick();
      if (pick) doMove(pick);
    }
  }
}

function drawSky(){
  var f = skyFrac();
  var g = ctx.createLinearGradient(0, 0, 0, H);
  var stops = [[0, C.predawn, C.skyHi], [0.30, C.predawn, '#6E5A54'], [0.68, C.predawn2, C.dawn], [0.88, C.skyHi, C.gold], [1, C.skyHi, C.day]];
  for (var si = 0; si < stops.length; si++){
    g.addColorStop(stops[si][0], lerpColor(stops[si][1], stops[si][2], f * 0.55));
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  var now = performance.now() / 1000;
  ctx.fillStyle = C.gold;
  for (var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = RM ? 0.4 : (0.4 + 0.5 * Math.abs(Math.sin(now / 900 + st.p)));
    ctx.globalAlpha = st.a * tw * (1 - f * 0.75);
    ctx.beginPath(); ctx.arc(st.x, st.y, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  var sunY = H + 40 - f * (H + 140);
  var sg = ctx.createRadialGradient(W*0.5, sunY, 8, W*0.5, sunY, 80);
  sg.addColorStop(0, 'rgba(242,184,75,0.35)');
  sg.addColorStop(1, 'rgba(232,147,58,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(W*0.5, sunY, 80, 0, Math.PI * 2); ctx.fill();
  for (var ci = 0; ci < clouds.length; ci++) drawCloud(clouds[ci]);
}

function cellXY(f, r){
  return { x: bx + (f + 0.5) * sq, y: by + (r + 1) * sq - 3 };
}

function drawBoard(){
  ctx.fillStyle = C.day2;
  ctx.fillRect(bx - 5, by - 5, board + 10, board + 10);
  for (var r = 0; r < 8; r++){
    for (var f = 0; f < 8; f++){
      if ((f + r) % 2 === 1){
        var dg = ctx.createLinearGradient(bx + f*sq, by + r*sq, bx + (f+1)*sq, by + (r+1)*sq);
        dg.addColorStop(0, '#2C4A3B');
        dg.addColorStop(1, '#12231B');
        ctx.fillStyle = dg;
      } else {
        ctx.fillStyle = C.day2;
      }
      ctx.fillRect(bx + f*sq, by + r*sq, sq + 0.5, sq + 0.5);
    }
  }
  /* coordinates */
  var fs = Math.max(9, sq * 0.16);
  ctx.font = '600 ' + fs + 'px "Spline Sans Mono", monospace';
  ctx.textBaseline = 'middle';
  var files = 'abcdefgh';
  for (var cf = 0; cf < 8; cf++){
    var darkSq = ((cf + 7) % 2 === 1);
    ctx.fillStyle = darkSq ? 'rgba(243,236,220,0.55)' : 'rgba(20,16,10,0.42)';
    ctx.textAlign = 'center';
    ctx.fillText(files[vF(cf)], bx + cf * sq + sq / 2, by + 8 * sq - fs * 0.85);
  }
  for (var cr = 0; cr < 8; cr++){
    var darkR = ((0 + cr) % 2 === 1);
    ctx.fillStyle = darkR ? 'rgba(243,236,220,0.55)' : 'rgba(20,16,10,0.42)';
    ctx.textAlign = 'left';
    ctx.fillText(String(vR(cr) + 1), bx + 3, by + cr * sq + sq / 2);
  }
  ctx.strokeStyle = 'rgba(20,16,10,0.28)'; ctx.lineWidth = 2;
  ctx.strokeRect(bx - 3, by - 3, board + 6, board + 6);
}

function drawMarks(){
  var i;
  if (lastMove){
    ctx.fillStyle = 'rgba(232,147,58,0.16)';
    ctx.fillRect(bx + vF(lastMove.f0) * sq, by + vR(lastMove.r0) * sq, sq, sq);
    ctx.fillRect(bx + vF(lastMove.f1) * sq, by + vR(lastMove.r1) * sq, sq, sq);
  }
  if (selected){
    var sx = bx + vF(selected.file) * sq, sy = by + vR(selected.rank) * sq;
    ctx.strokeStyle = C.dawn; ctx.lineWidth = 3;
    ctx.strokeRect(sx + 2, sy + 2, sq - 4, sq - 4);
  }
  if (checkSide){
    var k = kingOf(checkSide, pieces);
    if (k){
      var kc = cellXY(vF(k.file), vR(k.rank));
      ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
      ctx.setLineDash([Math.max(4, sq * 0.1), Math.max(3, sq * 0.075)]);
      ctx.beginPath(); ctx.arc(kc.x, kc.y - sq * 0.34, sq * 0.42, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  for (i = 0; i < flashes.length; i++){
    var fl = flashes[i];
    ctx.fillStyle = 'rgba(232,147,58,' + (0.5 * (fl.t / 0.28)).toFixed(3) + ')';
    ctx.fillRect(bx + vF(fl.f) * sq, by + vR(fl.r) * sq, sq, sq);
  }
  for (var j = 0; j < legal.length; j++){
    var m = legal[j];
    var cx = bx + (vF(m.f) + 0.5) * sq;
    var cy = by + (vR(m.r) + 0.5) * sq;
    if (m.capture || m.ep){
      ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, sq * 0.36, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(4, sq * 0.11), 0, Math.PI * 2); ctx.fill();
    }
  }
  if (hintMove){
    var hp = findPiece(hintMove.pid);
    if (hp){
      var p1 = cellXY(vF(hp.file), vR(hp.rank));
      var p2 = cellXY(vF(hintMove.f), vR(hintMove.r));
      var pulse = RM ? 0.8 : 0.55 + 0.3 * Math.sin(performance.now() / 160);
      ctx.strokeStyle = 'rgba(242,184,75,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y - sq * 0.35);
      ctx.lineTo(p2.x, p2.y - sq * 0.35);
      ctx.stroke();
      var ang = Math.atan2((p2.y - p1.y), (p2.x - p1.x));
      ctx.fillStyle = 'rgba(242,184,75,' + pulse.toFixed(3) + ')';
      ctx.save();
      ctx.translate(p2.x, p2.y - sq * 0.35);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-12, -6); ctx.lineTo(-12, 6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawPieces(){
  var t = RM ? 0 : performance.now() / 1000;
  var hopId = hop ? hop.id : -1;
  for (var i = 0; i < pieces.length; i++){
    var p = pieces[i];
    if (p.id === hopId) continue;
    var pos = cellXY(vF(p.file), vR(p.rank));
    var rot = 0;
    if (mateAnim && p.type === 'king' && p.side === mateAnim.side){
      var u = Math.min(1, mateAnim.t / mateAnim.dur);
      rot = easeIO(u) * (Math.PI / 2.1) * (p.dir || 1);
    }
    drawShadow(pos.x, pos.y, p.type);
    drawPieceAt(p, pos.x, pos.y, t, 1, rot);
  }
  if (hop){
    var p2 = findPiece(hop.id);
    if (p2){
      var u2 = Math.min(1, hop.t / hop.dur);
      var e = easeIO(u2);
      var x = bx + (vF(hop.f0) + (vF(hop.f1) - vF(hop.f0)) * e + 0.5) * sq;
      var y = by + (vR(hop.r0) + (vR(hop.r1) - vR(hop.r0)) * e + 1) * sq - 3;
      var lift = Math.sin(u2 * Math.PI) * sq * 0.28;
      var settle = 0;
      if (u2 > 0.82){
        var s = (u2 - 0.82) / 0.18;
        settle = Math.sin(s * Math.PI) * 2.6;
      }
      drawShadow(x, y, p2.type);
      drawPieceAt(p2, x, y - lift + settle, t, 1);
    }
  }
  for (var d = 0; d < departing.length; d++){
    var g = departing[d];
    var pos2 = cellXY(vF(g.file), vR(g.rank));
    ctx.save();
    ctx.globalAlpha = g.a;
    drawPieceAt(g, pos2.x, pos2.y, t, g.s);
    ctx.restore();
  }
  /* capture flights to the Pound */
  for (var fi = 0; fi < flights.length; fi++){
    var F = flights[fi];
    var fu = Math.min(1, F.t / F.dur);
    var fe = easeIO(fu);
    var fx = F.x0 + (F.x1 - F.x0) * fe;
    var fy = F.y0 + (F.y1 - F.y0) * fe - Math.sin(fu * Math.PI) * sq * 0.5;
    var fsize = sq * 0.8 + (24 - sq * 0.8) * fe;
    ctx.save();
    ctx.globalAlpha = fu > 0.85 ? (1 - fu) / 0.15 : 1;
    ctx.translate(fx, fy);
    ctx.rotate(Math.sin(fu * Math.PI) * 0.14);
    ctx.drawImage(F.spr, -fsize / 2, -fsize / 2, fsize, fsize);
    ctx.restore();
  }
}

function drawGeese(){
  if (!geese || RM) return;
  var bobY = Math.sin(geese.t * 2.2) * 4;
  ctx.save();
  ctx.translate(geese.x, geese.y + bobY);
  ctx.scale(0.85, 0.85);
  drawGoose(geese.t, 'w', true);
  ctx.restore();
  ctx.save();
  ctx.translate(geese.x + 52, geese.y + 24 - bobY * 0.7);
  ctx.scale(0.68, 0.68);
  drawGoose(geese.t + 1.4, 'w', true);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawBoard();
  drawMarks();
  drawPieces();
  drawGeese();
}

var last = performance.now();
function frame(now){
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
initScene();
updateRails();
if (!restore()){
  setStatus('Ink to move');
} else {
  updateRails();
  setStatus(STATE === 'over' ? 'game over' : (sideName(turn) + ' to move'));
}
selDiff.style.display = vsAI ? '' : 'none';
requestAnimationFrame(frame);
})();
</script>
