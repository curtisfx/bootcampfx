<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BootCampFX SPRINT — Endless Runner</title>
<meta name="description" content="BootCampFX SPRINT: an endless boot-camp runner. Jump the ball, slide the bars, chain combos. Free to play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --predawn:#0F1B2C; --predawn-2:#16273D; --pine:#14291F;
    --dawn:#E8933A; --gold:#F2B84B; --day:#FBF7EE; --day-2:#F3ECDC;
    --ink:#14100A; --mist:#9FB0C4; --stone:#6A6255;
    --display:'Fraunces',serif; --body:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',monospace;
    --ease:cubic-bezier(.22,.7,.25,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--predawn);overflow:hidden;
    font-family:var(--body);
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #game{display:block;width:100vw;height:100vh;background:var(--predawn);}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none;
    color:var(--day);z-index:5;text-shadow:0 2px 8px rgba(0,0,0,.45);font-family:var(--body);}
  .hud .stat{font-weight:700;letter-spacing:.02em;}
  .hud .stat b{display:block;font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1.1;}
  .hud .stat span{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.24em;color:var(--mist);}
  .hud .mid{text-align:center;}
  .hud .mid .combo{font-family:var(--mono);font-size:1rem;font-weight:600;letter-spacing:.12em;color:var(--gold);opacity:0;
    transform:translateY(6px);transition:opacity .15s,transform .15s;}
  .hud .mid .combo.on{opacity:1;transform:translateY(0);}
  .hud .right{text-align:right;}
  .banner{position:fixed;top:34%;left:0;right:0;text-align:center;pointer-events:none;
    opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s;z-index:6;}
  .banner.on{opacity:1;transform:scale(1);}
  .banner .big{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,8vw,4.5rem);
    color:var(--gold);letter-spacing:.02em;text-shadow:0 4px 24px rgba(242,184,75,.4);}
  .banner .sub{color:var(--mist);font-family:var(--mono);font-size:.8rem;letter-spacing:.34em;text-transform:uppercase;margin-top:2px;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(15,27,44,.74);backdrop-filter:blur(6px);
    z-index:10;opacity:0;pointer-events:none;transition:opacity .28s var(--ease);}
  .overlay.on{opacity:1;pointer-events:auto;}
  .overlay .title{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,9vw,5.2rem);
    color:var(--day);letter-spacing:.02em;text-align:center;line-height:.98;}
  .overlay .title em{font-style:italic;color:var(--dawn);}
  .overlay .tag{color:var(--mist);font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;
    font-size:.7rem;margin-top:12px;}
  .controls{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .ctl{display:flex;justify-content:center;align-items:baseline;gap:16px;
    font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;}
  .ctl .lbl{color:var(--day);font-weight:600;}
  .ctl .keys{color:var(--mist);}
  .tip{color:var(--gold);font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;margin-top:20px;}
  .overlay .scores{display:flex;gap:38px;margin:30px 0 26px;text-align:center;}
  .overlay .scores .num{font-family:var(--display);font-weight:600;font-size:2.3rem;color:var(--day);line-height:1;}
  .overlay .scores .lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mist);margin-top:6px;}
  .overlay .scores .num.record{color:var(--gold);}
  .overlay .newrec{color:var(--gold);font-family:var(--mono);font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    font-size:.78rem;animation:blink 1s steps(2,start) infinite;margin-bottom:10px;min-height:1.2em;}
  @keyframes blink{to{visibility:hidden;}}
  @keyframes ctaPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:14px;padding:16px 44px;
    background:var(--dawn);color:#1B1206;font-family:var(--body);font-weight:700;font-size:1.05rem;letter-spacing:.04em;
    box-shadow:0 10px 30px rgba(232,147,58,.35);
    animation:ctaPulse 3s ease-in-out infinite;
    transition:transform .16s var(--ease),background .16s var(--ease);}
  .btn:hover{transform:translateY(-2px);background:var(--gold);animation:none;}
  .btn:active{transform:translateY(0);}
  .hint{color:var(--mist);font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    margin-top:22px;text-align:center;line-height:1.9;}
  .hint b{color:var(--day);}
  .foot{position:fixed;bottom:8px;right:14px;color:rgba(159,176,196,.55);font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;z-index:4;}
  .foot a{color:rgba(159,176,196,.55);text-decoration:none;}
  .foot a:hover{color:var(--mist);}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="stat"><span>Score</span><b id="hudScore">0</b></div>
  <div class="mid"><div class="combo" id="hudCombo">COMBO ×0</div></div>
  <div class="right stat"><span>Best</span><b id="hudBest">0</b></div>
</div>

<div class="banner" id="banner"><div class="big" id="bannerBig"></div><div class="sub" id="bannerSub"></div></div>

<div class="overlay on" id="menu">
  <div class="title">Boot Camp <em>FX</em><br>SPRINT</div>
  <div class="tag">Run · Jump · Slide · Chain combos</div>
  <div class="controls">
    <div class="ctl"><span class="lbl">Jump</span><span class="keys">Space · ↑ · Tap</span></div>
    <div class="ctl"><span class="lbl">Slide</span><span class="keys">↓ · Swipe down</span></div>
  </div>
  <div class="tip">Perfect clears double your points</div>
  <button class="btn" id="startBtn">Start Sprint</button>
</div>

<div class="overlay" id="over">
  <div class="newrec" id="newRec">★ New Record ★</div>
  <div class="title">SPRINT <em>OVER</em></div>
  <div class="scores">
    <div><div class="num" id="finScore">0</div><div class="lbl">Score</div></div>
    <div><div class="num" id="finCombo">0</div><div class="lbl">Best Combo</div></div>
    <div><div class="num record" id="finBest">0</div><div class="lbl">Best</div></div>
  </div>
  <button class="btn" id="restartBtn">Run It Back</button>
  <div class="hint"><b>SPACE</b> / <b>ENTER</b> / <b>TAP</b> to restart</div>
</div>

<div class="foot">BOOTCAMP<span style="color:var(--dawn);">FX</span> — <a href="/" onclick="event.preventDefault();history.back();">back</a></div>

<script>
(function(){
"use strict";

/* ---------- canvas setup ---------- */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W = 0, H = 0, GROUND = 0;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GROUND = Math.round(H * 0.78);
}
window.addEventListener('resize', resize);
resize();

/* ---------- DOM refs ---------- */
var hudScore = document.getElementById('hudScore');
var hudBest = document.getElementById('hudBest');
var hudCombo = document.getElementById('hudCombo');
var bannerEl = document.getElementById('banner');
var bannerBigEl = document.getElementById('bannerBig');
var bannerSubEl = document.getElementById('bannerSub');
var menuEl = document.getElementById('menu');
var overEl = document.getElementById('over');
var newRecEl = document.getElementById('newRec');
var finScoreEl = document.getElementById('finScore');
var finComboEl = document.getElementById('finCombo');
var finBestEl = document.getElementById('finBest');

/* ---------- state ---------- */
var STATE = 'menu'; // menu | play | dying | over
var jumpBuf = 0;          // buffered jump requests (max 1)
var slideHeld = false;
var touchY0 = null, touchT0 = 0;
var deathT = 0;

/* ---------- player ---------- */
var player = {
  x: 0, y: 0, w: 34, h: 58, vx: 0, vy: 0,
  grounded: true, sliding: false, slideT: 0, fastFall: false,
  squash: 0, stretch: 0, hitFlash: 0, runPhase: 0
};
function resetPlayer(){
  player.x = Math.max(70, W * 0.22);
  player.y = GROUND - player.h;
  player.vx = 0; player.vy = 0;
  player.grounded = true; player.sliding = false; player.slideT = 0;
  player.fastFall = false; player.squash = 0; player.stretch = 0;
  player.hitFlash = 0; player.runPhase = 0;
}

/* ---------- world ---------- */
var GRAV = 2350, JUMP_V = -820, FAST_FALL_V = 1150;
var BASE_SPEED = 250;
var TIERS = [1, 1.35, 1.7, 2.1];
var TIER_EVERY = 25; // seconds of play per ramp
var objs = [], particles = [], pops = [];
var dist = 0, sinceSpawn = 0, tier = 0, gameT = 0;
var score = 0, combo = 0, bestCombo = 0, best = 0;
var nextGap = 0, spawnPause = 0;
var shake = 0;
var bannerT = 0, bannerMsg = '';

/* ---------- site palette (sunrise tokens) ---------- */
var C = {
  predawn:'#0F1B2C', predawn2:'#16273D', skyHi:'#2C3A50',
  pine:'#14291F', ink:'#14100A',
  dawn:'#E8933A', gold:'#F2B84B', day:'#FBF7EE',
  mist:'#9FB0C4', rabbit:'#9FB0C4', rabbitEar:'#8B9DB4', cream:'#F3ECDC',
  egretWing:'#F3ECDC', egretWingB:'#C9D4E2'
};

/* ---------- background décor (site language, non-interactive) ---------- */
var trees = [], clouds = [], egrets = [], ducks = [], rabbits = [];
function rnd(a, b){ return a + Math.random() * (b - a); }
function randTree(scale){
  return { x: rnd(0, W), s: scale };
}
function initDecor(){
  trees = []; clouds = []; egrets = []; ducks = []; rabbits = [];
  var i;
  for (i = 0; i < 14; i++) trees.push(randTree(rnd(0.45, 1.0)));
  for (i = 0; i < 4; i++) clouds.push({ x: rnd(0, W), y: rnd(H*0.08, H*0.4), s: rnd(0.5, 1.1), a: rnd(0.3, 0.55) });
  for (i = 0; i < 2; i++) egrets.push({ x: rnd(W*0.2, W*1.2), y: rnd(H*0.12, H*0.3), s: rnd(0.35, 0.5), fl: rnd(0, Math.PI*2) });
  for (i = 0; i < 1; i++) ducks.push({ x: rnd(W*0.3, W), s: rnd(0.8, 1.0), w: rnd(0, Math.PI*2) });
  for (i = 0; i < 1; i++) rabbits.push({ x: rnd(W*0.4, W), s: rnd(0.75, 1.0), hp: rnd(0, Math.PI*2) });
}
initDecor();

function tickDecor(dt){
  var sp = speed();
  var i;
  // trees — moderate parallax
  for (i = 0; i < trees.length; i++){
    var tr = trees[i];
    tr.x -= sp * 0.5 * dt;
    var tw = 100 * tr.s;
    if (tr.x < -tw - 20){ tr.x = W + rnd(10, 260); tr.s = rnd(0.45, 1.0); }
  }
  // clouds — slow drift
  for (i = 0; i < clouds.length; i++){
    var cl = clouds[i];
    cl.x -= sp * 0.07 * dt;
    if (cl.x < -140 * cl.s){ cl.x = W + rnd(0, 200); cl.y = rnd(H*0.08, H*0.4); cl.s = rnd(0.5, 1.1); cl.a = rnd(0.3, 0.55); }
  }
  // egrets — gentle flight + wing flap
  for (i = 0; i < egrets.length; i++){
    var e = egrets[i];
    e.x -= sp * 0.16 * dt; e.fl += dt * 5;
    if (e.x < -140){ e.x = W + rnd(60, 420); e.y = rnd(H*0.12, H*0.3); }
  }
  // ducks — ground parallax + waddle
  for (i = 0; i < ducks.length; i++){
    var d = ducks[i];
    d.x -= sp * 0.62 * dt; d.w += dt * 8;
    if (d.x < -60){ d.x = W + rnd(60, 320); }
  }
  // rabbits — foreground hop
  for (i = 0; i < rabbits.length; i++){
    var r = rabbits[i];
    r.x -= sp * 0.82 * dt; r.hp += dt * 7;
    if (r.x < -60){ r.x = W + rnd(80, 380); }
  }
}

/* ---------- storage ---------- */
function loadBest(){
  try { best = parseInt(localStorage.getItem('bootcampfxRunnerHighScore') || '0', 10) || 0; }
  catch(e){ best = 0; }
  hudBest.textContent = best;
}
function saveBest(){
  try { localStorage.setItem('bootcampfxRunnerHighScore', String(best)); } catch(e){ /* private mode */ }
}

/* ---------- obstacles ---------- */
function makeObstacle(){
  var last = objs.length ? objs[objs.length-1].type : null;
  var roll = Math.random();
  var type;
  if (objs.length === 0) type = roll < 0.5 ? 'ball' : 'block';
  else if (last === 'bar') type = roll < 0.6 ? 'ball' : 'block';
  else type = roll < 0.42 ? 'ball' : (roll < 0.72 ? 'block' : 'bar');
  var o = { type:type, x:W + 60, passed:false, minGap:1e9, seed:Math.random()*100 };
  if (type === 'ball'){ o.w = 40; o.h = 40; }
  else if (type === 'block'){ o.w = 44; o.h = 46; }
  else { o.w = 110; o.h = 34; o.gap = 42; } // overhead bar: 42px clearance
  return o;
}
function rollGap(){
  var t = Math.min(gameT / 90, 1);            // density ramps over 90s
  var minG = 240 - 90 * t, maxG = 560 - 220 * t;
  return minG + Math.random() * (maxG - minG);
}

/* ---------- particles / pops ---------- */
function burst(x, y, color, n){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, s = 60 + Math.random()*240;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 120,
      life:0.5 + Math.random()*0.3, t:0, c:color, r:2 + Math.random()*3 });
  }
}
function popScore(o, pts, perfect){
  var y = (o.type === 'bar') ? GROUND - o.gap - 46 : GROUND - o.h - 26;
  pops.push({ x:o.x + o.w/2, y:y, t:0, life:0.8, txt:(perfect ? 'PERFECT +' : '+') + pts, perfect:perfect });
}

/* ---------- game flow ---------- */
function startGame(){
  objs = []; particles = []; pops = [];
  dist = 0; sinceSpawn = 0; tier = 0; gameT = 0;
  score = 0; combo = 0; bestCombo = 0; spawnPause = 0; shake = 0;
  nextGap = 520; jumpBuf = 0; deathT = 0;
  resetPlayer();
  STATE = 'play';
  menuEl.classList.remove('on');
  overEl.classList.remove('on');
  newRecEl.style.visibility = 'hidden';
  hudScore.textContent = '0'; hudCombo.textContent = 'COMBO ×0';
  hudCombo.classList.remove('on');
}
function showGameOver(){
  STATE = 'over';
  if (score > best){ best = Math.floor(score); saveBest();
    newRecEl.style.visibility = 'visible';
  } else newRecEl.style.visibility = 'hidden';
  finScoreEl.textContent = Math.floor(score);
  finComboEl.textContent = bestCombo;
  finBestEl.textContent = best;
  hudBest.textContent = best;
  overEl.classList.add('on');
}

/* ---------- input ---------- */
function pressJump(){
  if (STATE === 'menu' || STATE === 'over'){ startGame(); return; }
  if (STATE === 'play'){
    if (player.grounded){ doJump(); }
    else if (jumpBuf === 0){ jumpBuf = 1; }   // buffer one, never more
  }
}
function doJump(){
  player.vy = JUMP_V; player.grounded = false; player.sliding = false;
  player.fastFall = false; player.stretch = 1; player.slideT = 0;
}
function pressSlide(){
  if (STATE !== 'play') return;
  slideHeld = true;
  if (!player.grounded && !player.fastFall){ player.fastFall = true; player.vy = Math.max(player.vy, FAST_FALL_V); }
}
function releaseSlide(){ slideHeld = false; }

window.addEventListener('keydown', function(e){
  if (['Space','ArrowUp','ArrowDown','Enter'].indexOf(e.code) !== -1) e.preventDefault();
  if (e.code === 'Space' || e.code === 'ArrowUp') pressJump();
  if (e.code === 'ArrowDown') pressSlide();
  if (e.code === 'Enter' && STATE === 'over') startGame();
});
window.addEventListener('keyup', function(e){
  if (e.code === 'ArrowDown') releaseSlide();
});
cv.addEventListener('pointerdown', function(e){
  touchY0 = e.clientY; touchT0 = Date.now();
});
cv.addEventListener('pointermove', function(e){
  if (touchY0 !== null && e.clientY - touchY0 > 44){ // swipe down = slide
    pressSlide(); touchY0 = null;
  }
});
cv.addEventListener('pointerup', function(e){
  if (touchY0 !== null && (Date.now() - touchT0) < 320) pressJump();
  touchY0 = null;
  releaseSlide();
});
cv.addEventListener('pointercancel', function(e){
  touchY0 = null;
  releaseSlide();
});
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- helpers ---------- */
function speed(){ return BASE_SPEED * TIERS[tier]; }
function hitTop(){ return player.sliding ? player.y + 22 : player.y + 8; }
function hitBot(){ return player.y + player.h - 2; }

function collide(o){
  var px = player.x + 7, pw = player.w - 14;
  var pt = hitTop();
  if (o.type === 'bar'){
    // bar bottom hangs at GROUND - gap; player is hit if his top is above it
    return (px < o.x + o.w - 4 && px + pw > o.x + 4 && pt < GROUND - o.gap);
  }
  var pb = hitBot(), ob = GROUND - o.h;
  return (px < o.x + o.w - 4 && px + pw > o.x + 4 && pb > ob && pt < GROUND - 2);
}

/* ---------- update ---------- */
function update(dt){
  if (STATE === 'dying'){
    deathT -= dt;
    if (shake > 0) shake -= dt;
    // knockback physics
    player.vy += GRAV * dt; player.y += player.vy * dt;
    player.x += player.vx * dt; player.vx *= Math.pow(0.02, dt);
    if (player.y > GROUND + 120){ player.y = GROUND + 120; player.vy = 0; }
    player.hitFlash = Math.max(0, player.hitFlash - dt * 5);
    tickParticles(dt);
    if (deathT <= 0) showGameOver();
    return;
  }
  if (STATE !== 'play') return;

  gameT += dt; dist += dt * speed();
  if (bannerT > 0){ bannerT -= dt; if (bannerT <= 0) bannerEl.classList.remove('on'); }
  if (spawnPause > 0) spawnPause -= dt;
  if (shake > 0) shake -= dt;

  tickDecor(dt);

  // speed ramps
  var newTier = Math.min(TIERS.length - 1, Math.floor(gameT / TIER_EVERY));
  if (newTier > tier){
    tier = newTier;
    spawnPause = 0.5;
    bannerMsg = 'SPEED RAMP ×' + String(TIERS[tier]).replace(/\.?0+$/,'');
    bannerBigEl.textContent = bannerMsg;
    bannerSubEl.textContent = 'Keep the pace, Marine';
    bannerEl.classList.add('on');
    bannerT = 1.3;
  }

  // player physics
  if (!player.grounded){
    player.vy += GRAV * dt;
    if (player.fastFall) player.vy += GRAV * 1.6 * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND - player.h){
      player.y = GROUND - player.h; player.vy = 0; player.grounded = true;
      player.squash = 1; player.fastFall = false;
      if (jumpBuf > 0){ jumpBuf = 0; doJump(); }
    }
  } else {
    player.slideT += dt;
    if (slideHeld) player.sliding = true;
    else if (player.slideT > 0.2) player.sliding = false;
  }
  player.squash = Math.max(0, player.squash - dt * 7);
  player.stretch = Math.max(0, player.stretch - dt * 7);
  player.hitFlash = Math.max(0, player.hitFlash - dt * 5);
  player.runPhase += dt * (10 + speed() / 40);

  // spawning
  if (spawnPause <= 0){
    sinceSpawn += speed() * dt;
    if (sinceSpawn >= nextGap){
      sinceSpawn = 0; objs.push(makeObstacle());
      nextGap = rollGap();
    }
  }

  // obstacles
  var sp = speed();
  for (var i = objs.length - 1; i >= 0; i--){
    var o = objs[i];
    o.x -= sp * dt;
    if (o.x + o.w < -80){ objs.splice(i, 1); continue; }
    if (o.passed) continue;
    if (o.x + o.w < player.x){
      o.passed = true;
      combo++; bestCombo = Math.max(bestCombo, combo);
      var perfect = o.minGap < 16;
      var pts = (25 + combo * 5) * (perfect ? 2 : 1);
      score += pts;
      popScore(o, pts, perfect);
      continue;
    }
    // track clearance while horizontally overlapping
    if (o.x < player.x + player.w && o.x + o.w > player.x){
      var pt = hitTop(), pb = hitBot();
      if (o.type === 'bar') o.minGap = Math.min(o.minGap, (GROUND - o.gap) - pt);
      else o.minGap = Math.min(o.minGap, pb - (GROUND - o.h));
    }
    if (collide(o)){ hit(o); break; }
  }

  // distance score
  score += sp * dt * 0.018;

  tickParticles(dt);

  // floating score pops
  for (var m = pops.length - 1; m >= 0; m--){
    var pp = pops[m]; pp.t += dt; pp.y -= 44 * dt;
    if (pp.t >= pp.life) pops.splice(m, 1);
  }

  // HUD
  hudScore.textContent = Math.floor(score);
  if (combo > 1){ hudCombo.textContent = 'COMBO ×' + combo; hudCombo.classList.add('on'); }
  else hudCombo.classList.remove('on');
}

function tickParticles(dt){
  for (var p = particles.length - 1; p >= 0; p--){
    var pt = particles[p];
    pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 900 * dt;
    if (pt.t >= pt.life) particles.splice(p, 1);
  }
}

function hit(o){
  player.vx = -420; player.vy = -340; player.grounded = false; player.sliding = false;
  player.hitFlash = 1; shake = 0.34; deathT = 0.55;
  burst(player.x + player.w/2, player.y + player.h/2, C.gold, 22);
  combo = 0; hudCombo.classList.remove('on');
  STATE = 'dying';
}

/* ---------- capsule helper (site's rounded-limb language) ---------- */
function capsule(x, y, w, h){
  var r = w / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

/* ---------- décor sprite draws (site SVG anatomy, canvas paths) ---------- */
function drawTree(t){
  var s = t.s, x = t.x;
  ctx.save();
  ctx.translate(x, GROUND);
  ctx.scale(s, s);
  // trunk — bare, ink
  ctx.fillStyle = 'rgba(20,16,10,0.8)';
  ctx.fillRect(44, 205, 10, 82);
  // layered pine canopy — site anatomy, descending opacity
  ctx.fillStyle = C.pine;
  ctx.globalAlpha = 1.0;  poly([[48,4],[60,34],[54,34],[66,62],[48,62],[32,62],[42,34],[36,34]]);
  ctx.globalAlpha = 0.96; poly([[50,46],[74,90],[60,90],[82,128],[48,128],[18,128],[36,90],[24,90]]);
  ctx.globalAlpha = 0.92; poly([[52,105],[86,155],[68,155],[92,182],[48,185],[10,185],[30,155],[16,155]]);
  ctx.globalAlpha = 0.88; poly([[24,168],[52,150],[82,165],[88,188],[50,182],[18,190]]);
  ctx.globalAlpha = 0.84; poly([[16,185],[50,172],[90,180],[96,208],[52,200],[8,210]]);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function poly(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function ballPent(cx, cy, r, rot){
  ctx.beginPath();
  for (var i = 0; i < 5; i++){
    var a = rot + i * Math.PI * 2 / 5 - Math.PI / 2;
    var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function drawCloud(c){
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.fillStyle = 'rgba(251,247,238,' + c.a + ')';
  ctx.beginPath();
  ctx.arc(0, 10, 16, 0, Math.PI * 2);
  ctx.arc(20, 0, 20, 0, Math.PI * 2);
  ctx.arc(44, 10, 15, 0, Math.PI * 2);
  ctx.fillRect(-4, 10, 54, 12);
  ctx.fill();
  ctx.restore();
}
function drawEgret(e){
  ctx.save();
  ctx.translate(e.x, e.y + Math.sin(e.fl) * 3); ctx.scale(e.s, e.s);
  var flap = Math.sin(e.fl) * 8;
  // trailing legs — ink
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(94, 40); ctx.lineTo(118, 46); ctx.moveTo(94, 42); ctx.lineTo(117, 52); ctx.stroke();
  // bottom wing (pale blue-grey)
  ctx.fillStyle = C.egretWingB;
  poly([[62,36],[46,40],[28,52],[14,70],[30,62],[48,52],[64,42]]);
  // body — day cream
  ctx.fillStyle = C.day;
  poly([[52,34],[60,28],[78,27],[92,34],[100,38],[100,44],[92,46],[76,50],[58,46],[50,40]]);
  // neck + head — day cream
  poly([[54,36],[46,30],[40,30],[36,24],[33,19],[36,14],[41,15],[45,16],[45,20],[43,23],[46,27],[52,29],[58,33]]);
  // beak — dawn
  ctx.fillStyle = C.dawn;
  poly([[38,17],[18,21],[37,23]]);
  // eye — ink
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(39.5, 18.5, 1.3, 0, Math.PI * 2); ctx.fill();
  // top wing — light, flapping
  ctx.fillStyle = C.egretWing;
  ctx.save();
  ctx.translate(62, 34); ctx.rotate(-flap * Math.PI / 180); ctx.translate(-62, -34);
  poly([[62,34],[44,26],[24,12],[8,-6],[30,-2],[52,10],[68,28]]);
  ctx.restore();
  ctx.restore();
}
function drawDuck(d){
  ctx.save();
  ctx.translate(d.x, GROUND + 2); ctx.scale(d.s, d.s);
  var wob = Math.sin(d.w) * 2;
  ctx.translate(0, wob * 0.4);
  // body — dawn
  ctx.fillStyle = C.dawn;
  poly([[14,26],[10,20],[14,14],[22,13],[24,8],[25,4],[30,3],[33,6],[36,9],[35,12],[32,14],[34,16],[42,17],[50,22],[52,28],[54,35],[48,40],[38,40],[22,40],[14,40],[10,34],[12,28]]);
  // beak — gold
  ctx.fillStyle = C.gold;
  poly([[26,7],[14,10],[25,12]]);
  // eye — ink
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(29, 8.5, 1.4, 0, Math.PI * 2); ctx.fill();
  // tail — darker dawn
  ctx.fillStyle = '#D07F2E';
  poly([[46,22],[50,20],[54,21],[56,24],[53,25],[49,25],[46,24]]);
  // legs — ink
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(26, 40); ctx.lineTo(26, 43); ctx.moveTo(36, 40); ctx.lineTo(36, 43); ctx.stroke();
  ctx.restore();
}
function drawRabbit(r){
  ctx.save();
  ctx.translate(r.x, GROUND + 2); ctx.scale(r.s, r.s);
  var hop = Math.abs(Math.sin(r.hp)) * -10;
  ctx.translate(0, hop);
  // ears — rabbit tones
  ctx.fillStyle = C.rabbit;
  poly([[20,14],[17,6],[17,1],[20,0],[23,1],[23,8],[23,14]]);
  ctx.fillStyle = C.rabbitEar;
  poly([[26,14],[25,5],[26,1],[29,1],[31,3],[30,9],[29,14]]);
  // body — stone/mist
  ctx.fillStyle = C.rabbit;
  poly([[18,22],[12,24],[8,30],[9,36],[10,43],[18,46],[28,46],[38,46],[44,42],[44,35],[44,28],[38,22],[30,21]]);
  // head
  ctx.beginPath(); ctx.arc(16, 22, 6, 0, Math.PI * 2); ctx.fill();
  // eye — ink
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(14, 20.5, 1.3, 0, Math.PI * 2); ctx.fill();
  // tail — cream
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.arc(45, 40, 4, 0, Math.PI * 2); ctx.fill();
  // legs — rabbit stroke
  ctx.strokeStyle = C.rabbit; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(12, 46); ctx.lineTo(8, 46); ctx.moveTo(34, 46); ctx.lineTo(40, 46); ctx.stroke();
  ctx.restore();
}

/* ---------- drawing ---------- */
function draw(){
  ctx.clearRect(0, 0, W, H);

  var shx = 0, shy = 0;
  if (shake > 0){ shx = (Math.random() - 0.5) * 14; shy = (Math.random() - 0.5) * 10; }
  ctx.save();
  ctx.translate(shx, shy);

  // predawn sky gradient — site hero
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, C.predawn); sky.addColorStop(0.62, C.predawn2); sky.addColorStop(1, C.skyHi);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // clouds — high, faint
  for (var ci = 0; ci < clouds.length; ci++) drawCloud(clouds[ci]);

  // egrets — mid-sky
  for (var ei = 0; ei < egrets.length; ei++) drawEgret(egrets[ei]);

  // tree line — replaces the grey skyline
  for (var ti = 0; ti < trees.length; ti++) drawTree(trees[ti]);

  // ground — pine
  ctx.fillStyle = C.pine;
  ctx.fillRect(0, GROUND, W, H - GROUND);
  // dawn ground line
  ctx.fillStyle = 'rgba(232,147,58,0.55)';
  ctx.fillRect(0, GROUND, W, 3);
  // ground ticks — faint mist
  ctx.strokeStyle = 'rgba(159,176,196,0.12)';
  ctx.lineWidth = 1;
  var gOff = (dist * 1) % 46;
  for (var g = -gOff; g < W + 46; g += 46){
    ctx.beginPath(); ctx.moveTo(g, GROUND + 16); ctx.lineTo(g + 20, GROUND + 16); ctx.stroke();
  }

  // ducks — ground décor
  for (var di = 0; di < ducks.length; di++) drawDuck(ducks[di]);

  // obstacles
  for (var k = 0; k < objs.length; k++) drawObstacle(objs[k]);

  // player
  drawPlayer();

  // rabbits — foreground décor (after player so they hop in front)
  for (var ri = 0; ri < rabbits.length; ri++) drawRabbit(rabbits[ri]);

  // particles
  for (var i = 0; i < particles.length; i++){
    var pt = particles[i];
    ctx.globalAlpha = 1 - pt.t / pt.life;
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating pops — gold perfect, cream normal
  for (var m = 0; m < pops.length; m++){
    var pp = pops[m];
    ctx.globalAlpha = 1 - pp.t / pp.life;
    ctx.fillStyle = pp.perfect ? C.gold : C.day;
    ctx.font = '700 ' + (pp.perfect ? 20 : 16) + 'px "Instrument Sans", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawObstacle(o){
  if (o.type === 'ball'){
    // soccer ball — cream with ink pentagons, rolling on the ground
    var br = o.w / 2, bx = o.x + br, by = GROUND - br;
    ctx.fillStyle = C.day;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.ink;
    ballPent(bx, by, br * 0.42, 0);
    for (var pn = 0; pn < 5; pn++){
      var pa = -Math.PI / 2 + pn * Math.PI * 2 / 5;
      ballPent(bx + Math.cos(pa) * br * 0.72, by + Math.sin(pa) * br * 0.72, br * 0.28, pa);
    }
  } else if (o.type === 'block'){
    // cinderblock — flat ink + dawn top stripe
    ctx.fillStyle = C.ink;
    ctx.fillRect(o.x, GROUND - o.h, o.w, o.h);
    ctx.fillStyle = C.dawn;
    ctx.fillRect(o.x, GROUND - o.h, o.w, 8);
    ctx.fillStyle = 'rgba(251,247,238,0.14)';
    ctx.fillRect(o.x + 4, GROUND - o.h + 12, o.w - 8, 10);
  } else {
    // overhead bar: hangs so its bottom sits at GROUND - gap
    var barTop = GROUND - o.gap - o.h;
    ctx.fillStyle = C.ink;
    ctx.fillRect(o.x, barTop, o.w, o.h);
    ctx.fillStyle = C.dawn;
    ctx.fillRect(o.x, GROUND - o.gap - 5, o.w, 5);
    ctx.fillStyle = 'rgba(251,247,238,0.12)';
    ctx.fillRect(o.x + 6, barTop + 10, o.w - 12, 8);
    // hangers up to the top of the screen
    ctx.fillStyle = C.pine;
    ctx.fillRect(o.x + 14, 0, 6, barTop);
    ctx.fillRect(o.x + o.w - 20, 0, 6, barTop);
  }
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h / 2);

  var sx = 1, sy = 1;
  if (player.squash > 0){ sx = 1 + 0.18 * player.squash; sy = 1 - 0.25 * player.squash; }
  if (player.stretch > 0){ sx = 1 - 0.12 * player.stretch; sy = 1 + 0.2 * player.stretch; }
  ctx.scale(sx, sy);

  if (player.hitFlash > 0.5) ctx.globalAlpha = 0.35 + Math.sin(player.hitFlash * 40) * 0.2;

  var sliding = player.sliding && player.grounded;
  var hw = player.w;
  ctx.fillStyle = C.ink;

  if (sliding){
    // compact slide silhouette — all-black capsule body
    capsule(-hw / 2 - 8, 2, hw + 12, 12);      // torso low
    ctx.beginPath(); ctx.arc(hw / 2 + 2, 4, 7, 0, Math.PI * 2); ctx.fill();  // head forward
    capsule(-hw / 2 - 10, 10, hw + 8, 7);       // legs extended
  } else {
    // upright runner — all-black, no face, capsule limbs (site jacker language)
    var ph = Math.sin(player.runPhase) * 9;
    var phB = Math.sin(player.runPhase + Math.PI) * 9;
    var torsoY = -20, torsoH = 28;
    var hipY = torsoY + torsoH - 3, shoY = torsoY + 4;

    if (player.grounded){
      // run cycle
      ctx.save(); ctx.translate(-4, hipY); ctx.rotate(ph * Math.PI / 180 * 1.6); capsule(-4, 0, 8, 20); ctx.restore();
      ctx.save(); ctx.translate(4, hipY); ctx.rotate(phB * Math.PI / 180 * 1.6); capsule(-4, 0, 8, 20); ctx.restore();
      capsule(-hw / 2 + 4, torsoY, hw - 8, torsoH);   // torso
      ctx.save(); ctx.translate(-6, shoY); ctx.rotate(phB * Math.PI / 180 * 1.1); capsule(-3, 0, 6, 17); ctx.restore();
      ctx.save(); ctx.translate(6, shoY); ctx.rotate(ph * Math.PI / 180 * 1.1); capsule(-3, 0, 6, 17); ctx.restore();
    } else {
      // airborne — legs tucked, arms driving
      ctx.save(); ctx.translate(-4, hipY); ctx.rotate(-38 * Math.PI / 180); capsule(-4, 0, 8, 18); ctx.restore();
      ctx.save(); ctx.translate(4, hipY); ctx.rotate(22 * Math.PI / 180); capsule(-4, 0, 8, 18); ctx.restore();
      capsule(-hw / 2 + 4, torsoY, hw - 8, torsoH);   // torso
      ctx.save(); ctx.translate(-6, shoY); ctx.rotate(30 * Math.PI / 180); capsule(-3, 0, 6, 16); ctx.restore();
      ctx.save(); ctx.translate(6, shoY); ctx.rotate(-24 * Math.PI / 180); capsule(-3, 0, 6, 16); ctx.restore();
    }
    // head — all-black, no face
    ctx.beginPath(); ctx.arc(1, torsoY - 10, 8, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;

  // ground shadow — site's "ground contact" rule, tight under feet
  if (!sliding || true){
    var airH = Math.max(0, (GROUND - player.h) - player.y);
    var sw = Math.max(0.45, 1 - airH / 240);
    var sa = Math.max(0.06, 0.2 * sw);
    ctx.fillStyle = 'rgba(20,16,10,' + sa + ')';
    ctx.beginPath();
    ctx.ellipse(player.x + player.w / 2, GROUND + 6, (player.w / 2 + 8) * sw, 4 * sw + 1, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------- main loop ---------- */
var last = performance.now();
function frame(now){
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
loadBest();
requestAnimationFrame(frame);
})();
</script>
</body>
